
    <section class="petc-background" >
        <img class="ib-background__img petc-img" [src]="images + backGroundImage" alt="Imagen de fondo">
    </section>
    <header class="ib-header-common ib-header-common--bottom">
        <ib-booking-header-simple/>
    </header>
    <section class="container petc-container">
        <div class="row">
            <div class="col-xs-12">
                <article class="u-mb-large u-mb-medium-md  u-mb-medium-mobile">
                    <div class="petc-line-spacing--title">
                        <h1 class="page-title">{{ petErrorPageTitle | translate }}</h1>
                    </div>
                    <div class="petc-line-spacing">
                        <p class="page-subtitle" *ngFor="let errorBody of petErrorPageBody">{{ errorBody | translate }}</p>
                    </div>
                    <div class="petc-line-spacing petc-line-spacing--text-center u-mt-large-mobile">
                        <a class="ib-button ib-button--big ib-button--w-xlarge ib-text--medium" (click)="goHomePage()">{{ 'PET_ERROR_PAGE_CTA' | translate
                        }}</a>
                    </div>
                </article>
            </div>
        </div>
    </section>

<ib-main-footer id="footer" [isFullWidth]="true" [isFixed]="true"/>
