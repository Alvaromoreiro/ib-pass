<header class="ib-modals__header ib-modals__header--inside u-pb-xmedium u-pb-xs" *ngIf="showHeader">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1 ib-heading--full"
            [translate]="modalTitle"
            [translateParams]="titleTranslateParams"
        ></h2>
    </div>
    <h3 class="ib-heading ib-heading--type-5 ib-heading--unfocused" *ngIf="model.subtitle">{{model.subtitle|translate}}</h3>
</header>
<section class="ib-modals__body">
    <ng-container *ngIf="body">
        <div class="ib-layout__line-spacing ib-layout__line-spacing--large" *ngFor="let text of body">
            <p class="ib-text">{{ text | translate }}</p>
        </div>
    </ng-container>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons" [ngClass]="{'justify-end': actionButtons.length ===1}">
        <button  *ngFor="let btn of actionButtons; let i = index" class="{{btn.class??''}}" 
        [ngClass]="{'ib-button ib-button--w-medium':  actionButtons.length ===1 || i!==0,
                    'ib-button__link ib-button__link--underline': actionButtons.length >1 && i===0}" 
        (click)="btn.action()" type="button">{{btn.text|translate}}</button>        
    </div>
</footer>
