<ng-container *ngIf="!mobileFlow else mobileFlowTemplate">
    <div class="ib-box ib-box--medium ib-box-check" *ngIf="termsAndConditionsCheck">
        <div class="ib-check ib-check--regular" [ngClass]="{'ib-check--error': termsControl.invalid && (termsControl.dirty || termsControl.touched)}">
            <input type="checkbox" class="ib-check__input" id="ohfree_accept_terms"
            [formControl]="termsControl"
            (change)="changeAcceptTerms()" required>
            <label for="ohfree_accept_terms" class="ib-check__label">
                <span class="ib-check__text ib-check__text--child-links-underline" [innerHtml]="termsAndConditionsCheck"></span>
            </label>
        </div>
        <div id="ohfree_accept_terms-err" *ngIf="termsControl.invalid && (termsControl.dirty || termsControl.touched)">
            <div class="ib-alert ib-alert--error" *ngIf="termsControl.errors?.['required']">{{'TOTAL_PRICE_CHECKBOX_CONDITIONS_REQUIRED_ERROR'|translate}}</div>
        </div>
    </div>
    <div class="ib-box ib-box--medium">
        <p class="ib-text ib-text--block ib-text--color-unfocused">{{ moduleTitle | translate }}</p>
        <div class="info">
            <div class="info_container">
                <div class="info_price">
                    <p class="info_price_onhold">
                        <span class="ib-text ib-text--especial ib-text--price-big" [ngClass]="{'ib-text--price-long': totalPrice?.length > 9}">{{'GENERAL_FREE_LABEL'|translate}}</span>
                        <span class="ib-text ib-text--color-unfocused">({{onHoldPrice}} {{'TOTAL_PRICE_ON_HOLD_PER_PASSENGER'| translate}})</span>
                    </p>
                </div>
                <p class="info_price_total">
                    <span class="ib-text ib-text--color-important">{{'TOTAL_PRICE_ON_HOLD_PRICE_TEXT'| translate}}</span>
                    <span class="ib-text ib-text--especial ib-text--price-xsmall ib-text--color-important">{{totalPrice}}</span>
                </p>
                <button id="AVAILABILITY_CONTINUE_BUTTON" title="{{ nextButtonText | translate }}" class="ib-button" type="submit" (click)="freeOnHoldContinueEvent()">{{ nextButtonText | translate }}</button>
            </div>
            <p class="ib-text ib-text--color-unfocused" *ngIf="conditionsText" [innerHtml]="conditionsText"></p>
        </div>

    </div>
</ng-container>
<ng-template #mobileFlowTemplate>
    <ib-booking-mobile-conditions [conditionsText]="conditionsText"></ib-booking-mobile-conditions>
</ng-template>
