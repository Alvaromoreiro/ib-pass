<header class="header-box">
    <div class="header-title-box">
        <h2 class="header-title-text">{{'MODAL_PAYMENT_TAXES_HEADER_TITLE'|translate}}</h2>
    </div>
    <div class="ib-modals__header-settings">
        <button (click)="dismiss()" type="button" class="ib-modals__button-action icon-cerrar" title="{{'GENERIC_MODAL_ACCESSIBLE_CLOSE'|translate}}">
            <span class="u-hide-accessible">{{'GENERIC_MODAL_ACCESSIBLE_CLOSE'|translate}}</span>
        </button>
    </div>
</header>
<section id="pmt-payment-taxes-modal" class="ib-modals__body">
    <div class="ib-layout__line-spacing">
        <div class="ib-table-modal">
            <table class="ib-table-modal__table">
                <caption class="u-hide-accessible">{{'MODAL_PAYMENT_TAXES_ACCESSIBLE_TABLE_DESCRIPTION'|translate}}</caption>
                <thead class="ib-table-modal__head">
                    <tr class="ib-table-modal__row">
                        <th class="ib-table-modal__column">{{'MODAL_PAYMENT_TAXES_TABLE_TITLE_1'|translate}}</th>
                        <th class="ib-table-modal__column">{{'MODAL_PAYMENT_TAXES_TABLE_TITLE_2'|translate}}</th>
                    </tr>
                </thead>
                <tbody class="ib-table-modal__body" *ngFor="let tax of model">
                    <tr class="ib-table-modal__row">
                        <td class="ib-table-modal__column">{{tax.description}}</td>
                        <td class="ib-table-modal__column">{{tax.amount}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</section>
<footer class="footer">
    <button class="footer-button footer-button-primary" title="{{'MODAL_PAYMENT_TAXES_ACCEPT_BUTTON'|translate}}" (click)="dismiss()">{{'MODAL_PAYMENT_TAXES_ACCEPT_BUTTON'|translate}}</button>
</footer>
