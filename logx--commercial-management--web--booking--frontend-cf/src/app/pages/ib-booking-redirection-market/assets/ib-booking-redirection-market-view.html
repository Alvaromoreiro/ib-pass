<main class="ib-layout">
    <ib-header-grey-bar show-all-info="::true" customer-data="$root.customerData" membership-data="$root.membershipData" is-logged="$root.isLogged"></ib-header-grey-bar>
    <ib-booking-header login-button="::true" position="1" close-session="::false" hide-extended-info="true"></ib-booking-header>
    <div class="container">
        <div class="row">
            <div class="col-xs-12">
                <div class="ib-layout__section">
                    <div id="bbki-redirection-market-currency-info-err-modal" class="ib-box-info ib-box-info--big ib-box-info--margin-top">
                        <div class="ib-box-info__header ib-box-info__header--bordered">
                            <h1 class="ib-heading ib-heading--type-1 ib-box-info__title--sm">{{'CHGCURR_TITLE'|translate}}</h1>
                        </div>
                        <div class="ib-box-info__body">
                            <p class="ib-text ib-text--block ib-text__spacing--medium">{{redMarktCtrl.newMarketInfo.message}}</p>
                        </div>
                        <div class="ib-box-info__footer">
                            <div class="row">
                                <div class="col-xs-6">
                                    <a id="bbki-redirection-market-return-homepage-link" class="ib-link" href="javascript:void(0)" data-ng-click="redMarktCtrl.returnHomePage()" title="{{'CHGCURR_BUTTON_TITLE_BACK'|translate}}">{{'AVAILABILITY_SLICE_DETAILS_BACK_BUTTON'|translate}}</a>
                                </div>
                                <div class="col-xs-6">
                                    <button id="bbki-redirection-market-continue-btn" data-ng-click="redMarktCtrl.reloadNewMarket()" class="ib-button ib-button--red ib-button--medium ib-button--w-smaller ib-button--right"
                                        type="button">{{'AVAILABILITY_BUTTON'|translate}}</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <ib-main-footer id="footer" footer-model="{'phoneInfo' : {'prefix' : $root.phonesList['RESERVAS'].prefix, 'phoneNumber': $root.phonesList['RESERVAS'].telephone, 'text': $root.phonesList['RESERVAS'].text }}"
    is-full-width="::true"></ib-main-footer>
</main>
