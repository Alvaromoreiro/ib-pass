<div class="row">
    <div class="col-xs-12">
        <div class="box">
            <div class="box__title">
                <h2 class="box__title-text">{{'ON_HOLD_CONF_SUMMARY_TITLE'|translate}}</h2>
            </div>
            <ib-flight-info-on-hold-conf [flightInfo]="generalInfo.flightInfo"></ib-flight-info-on-hold-conf>
            <ib-passenger-info-on-hold-conf [passengerInfo]="generalInfo.passengerInfo"></ib-passenger-info-on-hold-conf>
            <ib-contact-info-on-hold-conf [contactInfo]="generalInfo.primaryContactInfo"></ib-contact-info-on-hold-conf>
            <ib-price-breakdown-on-hold-conf *ngIf="generalInfo?.price"
                [price]="generalInfo.price" [passengerPrices]="generalInfo.passengerPrices"
                [paidDeposit]="generalInfo.paidDeposit" [originalPrice]="generalInfo.originalPrice"
                [voucherDiscount]="generalInfo.voucherDiscount">
            </ib-price-breakdown-on-hold-conf>
        </div>
    </div>
</div>
