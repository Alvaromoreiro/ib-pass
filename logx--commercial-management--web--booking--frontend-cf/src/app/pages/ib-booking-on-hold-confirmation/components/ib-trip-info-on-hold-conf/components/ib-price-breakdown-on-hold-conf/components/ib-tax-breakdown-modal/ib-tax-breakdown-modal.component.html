<header class="header-container">
    <h2 class="header-title">{{'MODAL_PAYMENT_TAXES_HEADER_TITLE'|translate}}</h2>
    <div class="header-button-container">
        <button type="button" class="header-button icon-cerrar" (click)="close()">
            <span class="u-hide-accessible">{{'GENERIC_MODAL_ACCESSIBLE_CLOSE'|translate}}</span>
        </button>
    </div>
</header>
<section class="body-container">
    <div class="body-spacing">
        <div class="ib-table-modal">
            <table class="ib-table-modal__table">
                <caption class="u-hide-accessible">{{'MODAL_PAYMENT_TAXES_ACCESSIBLE_TABLE_DESCRIPTION'|translate}}
                </caption>
                <thead class="body-table__head">
                    <tr class="body-table__row">
                        <th class="body-table__column">{{'MODAL_PAYMENT_TAXES_TABLE_TITLE_1'|translate}}</th>
                        <th class="body-table__column">{{'MODAL_PAYMENT_TAXES_TABLE_TITLE_2'|translate}}</th>
                    </tr>
                </thead>
                <tbody class="body-table__body" *ngFor="let tax of model">
                    <tr class="body-table__row">
                        <td class="body-table__column">{{tax.description}}</td>
                        <td class="body-table__column">{{tax.amount}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</section>
<footer class="footer-container">
    <div class="footer-button-container">
        <button class="footer-button" type="button"
            (click)="close()">{{'MODAL_PAYMENT_TAXES_ACCEPT_BUTTON'|translate}}</button>
    </div>
</footer>
