
    <section class="onb-background" >
        <img class="ib-background__img onb-img" [src]="images + backGroundImage" alt="Imagen de fondo">
    </section>
    <header class="ib-header-common ib-header-common--bottom">
        <ib-booking-header-simple/>
    </header>
    <section class="container onb-container">
        <div class="row">
            <div class="col-xs-12">
                <article class="ib-error-amadeus u-mb-large u-mb-medium-md  u-mb-medium-mobile">
                    <div class="onb-line-spacing--title">
                        <h1>
                            <span class="ib-error-amadeus__title ">{{ 'BKI_REDEMPTION_OB_ERROR_TITLE' | translate
                            }}</span>
                        </h1>
                    </div>
                    <div class="onb-line-spacing ">
                        <p class="ib-error-amadeus__description">{{ 'BKI_REDEMPTION_OB_INFO_MESSAGE_1' | translate
                        }}</p>
                    </div>
                    <div class="onb-line-spacing ">
                        <p class="ib-text--block ib-text--to-center ib-text--color-light ib-text--lh-medium ib-text--fslhmedium">{{ 'BKI_REDEMPTION_OB_INFO_MESSAGE_2' | translate
                        }}</p>
                    </div>
                    <div class="onb-line-spacing onb-line-spacing--text-center u-mt-large-mobile">
                        <a class="ib-button ib-button--unfocused ib-button--big ib-button--w-xlarge u-mb-small-mobile ib-text--medium ib-text--fslhmargin"
                           (click)="goRedemptionSearchEnginePage()">{{ 'BKI_REDEMPTION_OB_INFO_POINTS_BTN' | translate
                        }}</a>
                        <a class="ib-button ib-button--big ib-button--w-xlarge ib-text--medium" (click)="goHomePage()">{{ 'BKI_REDEMPTION_OB_INFO_HOME_BTN' | translate
                        }}</a>
                    </div>
                </article>
            </div>
        </div>
    </section>

<ib-main-footer id="footer" [isFullWidth]="true" [isFixed]="true"/>
