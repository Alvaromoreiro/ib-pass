<div class="header">
    <div class="header-slice" *ngIf="sliceInfo">
        <span>{{sliceInfo.origin}}</span>
        <ng-container [ngSwitch]="planeType">
            <ng-container *ngSwitchCase="'RETURN'">
                <ng-container *ngTemplateOutlet="returnPlane"></ng-container>
            </ng-container>
            <ng-container *ngSwitchDefault>
                <ng-container *ngTemplateOutlet="goPlane"></ng-container>
            </ng-container>
        </ng-container>
        <span>{{sliceInfo.destination}}</span>
    </div>
    <p class="header-cabin" 
        [ngClass]="{
            'cabin-color--business': fareFamily.cabinType === 'B',
            'cabin-color--premium': fareFamily.cabinType === 'N'
        }"
    >{{fareFamily.commercialName}}</p>
</div>
<div class="condition-list">
    <div class = "condition-item" *ngFor="let conditionElemt of fareConditionsList">
        <span class="condition-icon" 
            [class]="conditionElemt.icon"
            [ngClass]="{
                'cabin-color--business': fareFamily.cabinType === 'B',
                'cabin-color--premium': fareFamily.cabinType === 'N'
            }"

        ></span>
        <div class="condition-text">
            <p class="condition-title">{{conditionElemt.condition.name}}</p>
            <p class="condition-info">{{conditionElemt.condition.text}}</p>
        </div>
    </div>
</div>
