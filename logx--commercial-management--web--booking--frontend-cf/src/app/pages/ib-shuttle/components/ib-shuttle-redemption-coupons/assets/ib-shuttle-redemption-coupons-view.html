<div class="ib-box ib-box--medium u-pt-big">
        <!-- Head Cupones -->
        <div class="ib-summary u-mb-small">
            <header class="ib-summary__header u-mb-small">
                <h2 ng-if="ScoupCtrl.totalPrice.promotionApplied" class="ib-heading ib-heading--responsive">Puedes mantener la promoción activa o aplicar uno de tus cupones descuento</h2>
                <h2 ng-if="!ScoupCtrl.totalPrice.promotionApplied" class="ib-heading ib-heading--responsive">Tus cupones descuento</h2>
            </header>
            <!-- Componente cupones -->
            <div ng-class="{'ib-coupon-container': ScoupCtrl.coupons.length < 4, 'ib-coupon-container--lenght-4': ScoupCtrl.coupons.length = 4, 'ib-coupon-container--lenght-5': ScoupCtrl.coupons.length > 4}">
                <ul class="ib-coupon-container__wrapper">
                    <li ng-if="ScoupCtrl.totalPrice.promotionApplied" class="ib-coupon-container__box ib-box-coupon">
                        <div class="ib-box-coupon__container">
                            <label class="ib-box-coupon__label" for="coupon">
                                <input class="ib-box-coupon__check" type="radio" id="coupon" name="coupons" ng-click = "ScoupCtrl.refresh()" checked />
                                <p class="ib-box-coupon__title">Mantener promoción activa</p>
                            </label>
                        </div>
                    </li>
                    <li ng-if="!ScoupCtrl.totalPrice.promotionApplied" class="ib-coupon-container__box ib-box-coupon--no-active">
                        <div class="ib-box-coupon__container">
                            <label class="ib-box-coupon__label" for="coupon">
                                <input class="ib-box-coupon__check" type="radio" id="coupon" name="coupons"
                                    ng-click="ScoupCtrl.refresh()" checked />
                                <p class="ib-box-coupon__title">Sin descuento</p>
                            </label>
                        </div>
                    </li>
                    <li class="ib-coupon-container__box ib-box-coupon" data-ng-repeat="(index, coupon) in ScoupCtrl.coupons">
                        <div class="ib-box-coupon__container" ng-if="coupon">
                            <label class="ib-box-coupon__label" for="coupon-{{index}}">
                                <input class="ib-box-coupon__check" type="radio" id="coupon-{{index}}" name="coupons" ng-click="ScoupCtrl.selectCoupon(coupon)" />
                                <p class="ib-box-coupon__title">{{coupon.discount}}% de descuento en tu reserva con Avios </p>
                                <p class="ib-box-coupon__terms">
                                    <div class="ib-box-coupon__terms" ng-if="coupon.endDate">{{coupon.remainQuantity}} usos restantes del {{coupon.startDate | date: 'dd/MM/yyyy'}} al {{coupon.endDate | date: 'dd/MM/yyyy'}}.</div>
                                    <div class="ib-box-coupon__terms" ng-if="!coupon.endDate">{{coupon.remainQuantity}} usos restantes a partir de {{coupon.startDate | date: 'dd/MM/yyyy'}}.</div>                                    
                                    <a class="ib-box-coupon__terms-link" target="blank" ng-click="ScoupCtrl.seeConditions($event, coupon)" title="{{'SEE_CONDITIONS' | translate}}">{{'SEE_CONDITIONS' | translate}}</a>
                                </p>
                            </label>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
        <p class="ib-text ib-text--color-unfocused">Solo se muestran los cupones activos aplicables a las condiciones
            del vuelo escogido. Los cupones no serán acumulables a las posibles promociones vigentes</p>
    </div>
</div>
