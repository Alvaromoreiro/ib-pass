<header class="ib-modals__header">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-2">
            <span class="ib-heading__icon ib-heading__icon--default ib-heading__icon--small icon-alerta_grave"></span>
            <span class="ib-heading__text">{{'MODAL_LASTMINUTE_TITLE'| translate:{hLeft: modalCtrl.model.timeLeft.hours, minLeft: modalCtrl.model.timeLeft.minutes} }}</span></h2>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--large" data-ng-bind-html="modalCtrl.model.body">
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons ib-content-buttons--not-reversed">
        <div class="ib-content-buttons__content-left">
            <button id="MODAL_LASTMINUTE_CHANGE_SELECTED_CONTINUE" class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.accept()">{{'MODAL_LASTMINUTE_ACCEPT'|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <button id="MODAL_LASTMINUTE_CHANGE_SELECTED_FLIGHT" class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.close()">{{'MODAL_LASTMINUTE_CANCEL'|translate}}</button>
        </div>
    </div>
</footer>
