<header class="ib-modals__header ng-scope">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1">{{'FLIGHT_TITTLE_MODAL_CALENDAR'| translate}} {{modalCtrl.model.originDestinations.originCity.description}} - {{modalCtrl.model.originDestinations.destinationCity.description}}</h2>
    </div>
    <div class="ib-modals__header-settings">
        <button id="bbki-calendar-avios-close-btn" type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">{{'GENERIC_MODAL_ACCESSIBLE_CLOSE'|translate}}</span>
        </button>
    </div>
</header>
    <ib-booking-calendar id="bbki-calendar-avios-calendar" origin-destinations="modalCtrl.model.originDestinations"current-origin-destination-index="modalCtrl.model.currentOriginDestinationIndex"></ib-booking-calendar>
