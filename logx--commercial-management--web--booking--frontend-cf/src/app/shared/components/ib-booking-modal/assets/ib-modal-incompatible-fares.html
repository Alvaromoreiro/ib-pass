<header class="ib-modals__header">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1">
            <span class="ib-heading__icon ib-heading__icon--default icon-alerta_grave"></span>
            <span class="ib-heading__text">{{'INCOMPATIBLE_FARES_TITLE'|translate}}</span></h2>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--small">
        <p class="ib-text">{{'INCOMPATIBLE_FARES_BODY_1'|translate}}</p>
    </div>
    <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
        <p class="ib-text">{{'INCOMPATIBLE_FARES_BODY_2'|translate}}</p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons ib-content-buttons--not-reversed" data-ng-if="!modalCtrl.model.changeFare">
        <div class="ib-content-buttons__content-left">
            <button id="INCOMPATIBLE_FARES_CHANGE_OUTBOUND" class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.accept()">{{'INCOMPATIBLE_FARES_CHANGE_OUTBOUND_BUTTON'|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <button id="INCOMPATIBLE_FARES_CHANGE_INBOUND" class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.close()">{{'INCOMPATIBLE_FARES_CHANGE_INBOUND_BUTTON'|translate}}</button>
        </div>
    </div>
    <div class="ib-content-buttons ib-content-buttons--options" data-ng-if="modalCtrl.model.changeFare">
        <div class="ib-content-buttons__content-left">
            <button id="INCOMPATIBLE_FARES_CHANGE_OUTBOUND" class="ib-button ib-button--w-medium ib-button--inverse" type="button" ng-click="modalCtrl.accept()">{{'INCOMPATIBLE_FARES_CHANGE_OUTBOUND_BUTTON'|translate}}</button>
            <button id="INCOMPATIBLE_FARES_CHANGE_INBOUND" class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.close()">{{'INCOMPATIBLE_FARES_CHANGE_INBOUND_BUTTON'|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <a id="bbki-incompatible-fares-back-selected-link" href="javascript:void(0)" ng-click="modalCtrl.accept('changeFare')" title="{{'AVAILABILITY_BACK_TO_SELECTED_FLIGHT' | translate}}"
                class="ib-link">{{'AVAILABILITY_BACK_TO_SELECTED_FLIGHT' | translate}}</a>
        </div>
    </div>
</footer>
