<header class="ib-modals__header">
    <h2 class="ib-heading ib-heading--type-1">{{'AVAILABILITY_REDEMPTION_MODAL_AVIOS_TITLE'|translate}}</h2>
    <div class="ib-modals__header-settings">
        <button id="bbki-avios-buy-2-close-btn" type="button" class="ib-modals__button-action icon-cerrar" data-ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">{{'GENERIC_MODAL_ACCESSIBLE_CLOSE'|translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--large u-display-inline-block ">
        <div class="ib-msg-alert ib-msg-alert--success icon-informacion_2">
            <div class="ib-layout__line-spacing ib-layout__line-spacing--small">
                <p class="ib-msg-alert__text ib-msg-alert__text--bold">{{'AVAILABILITY_REDEMPTION_MODAL_AVIOS_INFO'|translate}}</p>
            </div>
        </div>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
            <button id="bbki-avios-buy-2-accept-btn" class="ib-button ib-button--w-medium" type="button" data-ng-click="modalCtrl.acceptBuyAvios()">{{'AVAILABILITY_REDEMPTION_MODAL_AVIOS_CONTINUE'|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <a id="bbki-avios-buy-2-close-link" href="" title="{{'AVAILABILITY_REDEMPTION_MODAL_AVIOS_CANCEL'|translate}}" class="ib-link" data-ng-click="modalCtrl.close()">{{'AVAILABILITY_REDEMPTION_MODAL_AVIOS_CANCEL'|translate}}</a>
        </div>
    </div>
</footer>
