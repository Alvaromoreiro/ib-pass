<header class="ib-modals__header">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1">{{'MODAL_ITRAVEL_WARNING_TITLE'|translate}}</h2>
    </div>
    <div class="ib-modals__header-settings">
        <button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.checkItravelAgain()">
            <span class="u-hide-accessible">{{'MODAL_HIDDEN_CLOSE_TEXT'|translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--medium">
        <p class="ib-text">{{'MODAL_ITRAVEL_WARNING_SUBTITLE'|translate}}</p>    
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
            <button class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.accept()">{{'MODAL_ITRAVEL_WARNING_CTA'|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <a title="Voy a viajar" class="ib-link" ng-click="modalCtrl.checkItravelAgain()">{{'MODAL_ITRAVEL_WARNING_LINK'|translate}}</a>
        </div>
    </div>
</footer>
