
<section class="ib-modals__body">
    <div id="bbki-calendar-loading-elem" class="ib-mosaic__loading" data-ng-if="calendarCtrl.loadingGrid">
        <div class="ib-mosaic__loading__container">
            <div class="ib-mosaic__loading__icon">
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
            <span class="ib-mosaic__loading__text">{{'AVAILABILITY_REDEMPTION_WAITING_LOADING_CALENDAR_GRID'|translate}}</span>
        </div>
    </div>
    <div ng-if="!calendarCtrl.loadingGrid">
        <div class="u-pt">
            <ib-booking-slider-calendar id="bbki-calendar-slider-calendar" slider-model="calendarCtrl.model.actualSlice.sliderModel" month-index="calendarCtrl.model.monthIndex"></ib-booking-slider-calendar>
        </div>
        <div class="u-mt">
    <ib-booking-calendar-matrix id="bbki-calendar-calendar-matrix" matrix-model="calendarCtrl.model.actualSlice.matrixModel"></ib-booking-calendar-matrix>
        </div>
    </div>    
</section>
