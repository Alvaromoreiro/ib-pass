<header class="header-container">
    <div class="header-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="24" viewBox="0 0 32 24" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd"
                d="M5.65358 18.3067L0 23.9992V24C19.6248 24 24.2514 19.3975 26.951 13.1324L29.2179 7.23498C22.606 7.4248 12.6286 11.3125 5.65358 18.3067Z"
                fill="url(#paint0_linear_2821_743)" />
            <path fill-rule="evenodd" clip-rule="evenodd"
                d="M18.8362 4.99071L12.4751 11.4185C18.5145 7.09086 24.5374 4.47999 30.5376 3.8058L32.0002 0.000226021C23.1178 0.000226021 21.9081 1.93766 18.8362 4.99071Z"
                fill="url(#paint1_linear_2821_743)" />
            <defs>
                <linearGradient id="paint0_linear_2821_743" x1="-13.683" y1="17.2972" x2="0.750162" y2="-7.951"
                    gradientUnits="userSpaceOnUse">
                    <stop stop-color="#A61C22" />
                    <stop offset="0.5" stop-color="#DC1C2E" />
                    <stop offset="1" stop-color="#DC1C2E" />
                </linearGradient>
                <linearGradient id="paint1_linear_2821_743" x1="2.58352" y1="5.27257" x2="12.6486" y2="-11.6781"
                    gradientUnits="userSpaceOnUse">
                    <stop stop-color="#ED7417" />
                    <stop offset="0.85" stop-color="#FACD08" />
                    <stop offset="1" stop-color="#FACD08" />
                </linearGradient>
            </defs>
        </svg>
        <h2 class="header-title-text">{{'SOFT_LOGIN_MODAL_TITLE'|translate}}</h2>
    </div>
    <p class="header-subtitle">{{'SOFT_LOGIN_MODAL_SUBTITLE'|translate}}</p>
    <div class="ib-modals__header-settings">
        <button (click)="dismiss()" type="button" class="ib-modals__button-action icon-cerrar"
            title="{{'GENERIC_MODAL_ACCESSIBLE_CLOSE'|translate}}">
            <span class="u-hide-accessible">{{'GENERIC_MODAL_ACCESSIBLE_CLOSE'|translate}}</span>
        </button>
    </div>

</header>
<section>
    <ul class="body-list">
        <li class="body-list-item" *ngFor="let item of listItemTitles">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path
                    d="M15 4.00503L13.9201 2.96387L6.78692 8.0583L2.23002 5.03651L1 6.25685L4.99516 12.1164C5.05327 12.1939 5.11622 12.2665 5.18886 12.3343C6.10412 13.2447 7.66828 13.2883 8.49637 12.3537L15 4.00503Z"
                    fill="#D7192D" />
            </svg>
            {{item | translate}}
        </li>
    </ul>
</section>
<footer class="footer">
    <button class="footer-button" (click)="close()" loginMobileTrigger loginTrigger title="{{'SOFT_LOGIN_MODAL_TITLE'|translate}}">
        {{'SOFT_LOGIN_MODAL_TITLE'|translate}}
    </button>
</footer>
