<div class="slick-carousel" ib-carousel>
    <button focusin id="SLICK_PREV_BUTTON_{{::slickCtrl.carouselIndex}}" ng-disabled="slickCtrl.options.prevButtonDisabled" ng-hide="slickCtrl.options.prevButtonHidden" class="ib-date-carousel__button-prev ib-date-carousel__button ib-date-carousel__button-prev--medium" ng-class="{'ib-date-carousel__button-next--disabled': slickCtrl.options.prevButtonDisabled}" type="button" aria-label="Previous" tabindex="0" role="button" ng-click="slickCtrl.previousSlide($event)">{{slickCtrl.options.prevButtonText}}</button>
    <div id="SLICK_CARROUSEL_LIST_{{::slickCtrl.carouselIndex}}" class="slick-carousel-list" ng-transclude></div>
    <button focusin id="SLICK_NEXT_BUTTON_{{::slickCtrl.carouselIndex}}" ng-disabled="slickCtrl.options.nextButtonDisabled" ng-hide="slickCtrl.options.nextButtonHidden" class="ib-date-carousel__button-next ib-date-carousel__button ib-date-carousel__button-next--medium" ng-class="{'ib-date-carousel__button-next--disabled': slickCtrl.options.nextButtonDisabled}" type="button" aria-label="Next" tabindex="0" role="button" ng-click="slickCtrl.nextSlide($event)">{{slickCtrl.options.nextButtonText}}</button>
</div>
