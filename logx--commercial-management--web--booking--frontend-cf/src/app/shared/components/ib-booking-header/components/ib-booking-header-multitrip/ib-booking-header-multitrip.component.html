<div class="ib-header-common__container-top">
    <!-- Ida -->
    <span class="ib-header-common__city">
        {{trip.originCode}}
    </span>
    <!-- Flechas -->
    <span class="ib-header-common__fly-icon" [ngClass]="{'ib-header-common__fly-icon--one-direction icon-arrow-right': !trip.returnFlight,
    'ib-header-common__fly-icon--transfer icon-flechas': trip.returnFlight}"></span>
    <!-- Vuelta -->
    <span class="ib-header-common__city">
        {{trip.destinyCode}}
    </span>
</div>
<!-- Fechas de vuelo -->
<div class="ib-header-common__container-bottom hidden-md hidden-sm hidden-xs">
    <span class="ib-header-common__date text-center">{{trip.dateFlight | shortDateFormat}}</span>
</div>
