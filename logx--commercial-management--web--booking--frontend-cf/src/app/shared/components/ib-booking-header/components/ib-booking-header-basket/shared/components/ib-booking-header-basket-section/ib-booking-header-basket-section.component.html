<section class="ib-summary-breakdown__section ib-summary-breakdown__section--padding-small ib-summary-breakdown__section--separator u-pb-none">
    <header class="ib-summary-breakdown__section-header">
        <span class="ib-summary-breakdown__icon ib-summary-breakdown__icon--absolute" [ngClass]="setIcon( model.info.category )"></span>
        <h4 class="ib-summary-breakdown__section-title ib-summary-breakdown__section-title--with-icon">{{model.info.title|translate}}</h4>
    </header>
    <ul class="ib-summary-breakdown__list ib-summary-breakdown__list--padding-none"
        *ngFor="let item of model.info.items">
        <li class="ib-summary-breakdown__item"
            *ngFor="let concept of item.concepts">
            <div class="ib-summary-breakdown__item-content">
                <span class="ib-summary-breakdown__item-text">
                    <span *ngIf="concept.quantity">{{concept.quantity}} {{concept.description}}</span>
                </span>

                <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--wrap ib-summary-breakdown__item-text--text-right">
                    {{concept.priceFormatted}}
                    <button
                        *ngIf="!deleteFlag && !loadingVoucher"
                        class="ib-link ib-link--primary ib-link--underline"
                        (click)="deleteAncillarie(model.info.delete)"
                        title="{{'DELETE_TEXT'|translate}}">
                        <span class="ib-text-icon__icon icon-cerrar"></span>
                    </button>
                </span>
            </div>
        </li>
    </ul>
</section>
<div class="ib-summary-breakdown__subtotal ib-summary-breakdown__subtotal--separator" *ngIf="model?.info?.amount">
    <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--black ib-summary-breakdown__item-text--text-left">{{model.info.amount.title|translate|uppercase}}</span>
    <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--bold ib-summary-breakdown__item-text--black ib-summary-breakdown__item-text--wrap ib-summary-breakdown__item-text--text-right">{{model.info.amount.priceFormatted}}</span>
</div>
