<section *ngIf="model.hasElements" class="ib-summary-breakdown__section ib-summary-breakdown__section--padding-small ib-summary-breakdown__section--separator u-pb-none">
    <header class="ib-summary-breakdown__section-header">
        <span class="ib-summary-breakdown__icon ib-summary-breakdown__icon--absolute"></span>
        <h4 class="ib-summary-breakdown__section-title ib-summary-breakdown__section-title--without-icon">{{'SUMMARY_OTHER_FEES'|translate}}</h4>
    </header>
    <ul class="ib-summary-breakdown__list ib-summary-breakdown__list--padding-none">
        <li class="ib-summary-breakdown__item" *ngFor="let feeInfo of model.others">
            <div class="ib-summary-breakdown__item-content">
                <span class="ib-summary-breakdown__item-text">{{feeInfo.description | translate}}</span>
                <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--wrap ib-summary-breakdown__item-text--text-right">{{feeInfo.totalFormatted}}</span>
            </div>
        </li>
    </ul>
</section>
<div *ngIf="model.hasElements" class="ib-summary-breakdown__subtotal ib-summary-breakdown__subtotal--separator">
    <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--black ib-summary-breakdown__item-text--text-left">{{'HEADER_BASKET_OTHERS_AMOUNT'|translate|uppercase}}</span>
    <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--bold ib-summary-breakdown__item-text--black ib-summary-breakdown__item-text--wrap ib-summary-breakdown__item-text--text-right">{{model.total.totalFormatted}}</span>
</div>
