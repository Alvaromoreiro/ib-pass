<section *ngIf="model.hasAssistCard" class="ib-summary-breakdown__section ib-summary-breakdown__section--padding-small ib-summary-breakdown__section--separator u-pb-none">
    <header class="ib-summary-breakdown__section-header">
        <span class="ib-summary-breakdown__icon ib-summary-breakdown__icon--absolute icon-seguros"></span>
        <h4 class="ib-summary-breakdown__section-title ib-summary-breakdown__section-title--with-icon">{{'ANCILLARIES_ASSIST_CARD_BASKET_INFO'|translate}}</h4>
    </header>
    <ul class="ib-summary-breakdown__list ib-summary-breakdown__list--padding-none">
        <li class="ib-summary-breakdown__item">
            <div class="ib-summary-breakdown__item-content">
                <span class="ib-summary-breakdown__item-text">{{model.name}}</span>
                <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--wrap ib-summary-breakdown__item-text--text-right">
                     {{model.total.totalFormatted}}
                    <button class="ib-link ib-link--primary ib-link--underline"
                        (click)="deleteAssistCard()" *ngIf="!deleteFlag && !loadingVoucher"
                        title="{{'DELETE_TEXT'|translate}}">
                            <span class="ib-text-icon__icon icon-cerrar"></span>
                    </button>
                </span>
            </div>
        </li>
    </ul>
</section>
<div *ngIf="model.hasAssistCard" class="ib-summary-breakdown__subtotal ib-summary-breakdown__subtotal--separator">
    <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--black ib-summary-breakdown__item-text--text-left">{{'ANCILLARIES_ASSIST_CARD_IMPORT'|translate|uppercase}}</span>
    <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--bold ib-summary-breakdown__item-text--black ib-summary-breakdown__item-text--wrap ib-summary-breakdown__item-text--text-right">{{model.total.totalFormatted}}</span>
</div>
