<section *ngIf="model?.hasTransfersGlobick"
    class="ib-summary-breakdown__section ib-summary-breakdown__section--padding-small ib-summary-breakdown__section--separator u-pb-none">
    <header class="ib-summary-breakdown__section-header">
        <span class="ib-summary-breakdown__icon ib-summary-breakdown__icon--absolute icon-traslados"></span>
        <h4 class="ib-summary-breakdown__section-title ib-summary-breakdown__section-title--with-icon ib-summary-breakdown__section-title--with-close"
            [innerHtml]="'WIDGET_YOUR_TRANSFERS_GENERAL_TITLE_BASKET'|translate"></h4>
        <span *ngIf="model?.info?.dateReturn !== ''"
            class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--wrap ib-summary-breakdown__item-text--text-right u-float-right">
                {{model?.total?.totalFormatted}}
                <button class="ib-link ib-link--primary ib-link--underline"
                    *ngIf="!deleteFlag && !loadingVoucher"
                    (click)="removeTransfersGlobick()"
                    title="{{'DELETE_TEXT'|translate}}">
                    <span class="ib-text-icon__icon icon-cerrar"></span>
                </button>
            </span>
    </header>
    <ul class="ib-summary-breakdown__list ib-summary-breakdown__list--padding-none">
        <li class="ib-summary-breakdown__item" [ngClass]="{'u-pb-xsmall': model?.info?.dateReturn !== ''}">
            <span [ngClass]="{'u-pb-none': model?.info?.dateReturn !== ''}"
            class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--bold ib-summary-breakdown__item-text--subtitle ib-summary-breakdown__item-text--full u-mb-none">{{model?.info?.transferCar}}</span>
            <div class="ib-summary-breakdown__item-content">
                <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-text--block">
                    {{model?.info?.date}}
                </span>
                <span *ngIf="model?.info?.dateReturn === ''"
                    class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--wrap ib-summary-breakdown__item-text--text-right">
                        {{model?.info?.totalFormatted}}
                        <button class="ib-link ib-link--primary ib-link--underline"
                            *ngIf="!deleteFlag && !loadingVoucher"
                            (click)="removeTransfersGlobick()"
                            title="{{'DELETE_TEXT'|translate}}">
                            <span class="ib-text-icon__icon icon-cerrar"></span>
                        </button>
                </span>
            </div>
        </li>
        <li class="ib-summary-breakdown__item" *ngIf="model?.info?.dateReturn !== ''">
            <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--bold ib-summary-breakdown__item-text--subtitle ib-summary-breakdown__item-text--full u-mb-none">{{model?.info?.transferCar}}</span>
            <div class="ib-summary-breakdown__item-content">
                <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-text--block">
                    {{model?.info?.dateReturn}}
                </span>
            </div>
        </li>
    </ul>
</section>
<div *ngIf="model?.hasTransfersGlobick" class="ib-summary-breakdown__subtotal ib-summary-breakdown__subtotal--separator">
    <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--black ib-summary-breakdown__item-text--text-left">{{'HEADER_BASKET_GLOBICK_TRANSFER_AMOUNT'|translate|uppercase}}: </span>
    <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--lh-normal ib-summary-breakdown__item-text--bold ib-summary-breakdown__item-text--black ib-summary-breakdown__item-text--wrap ib-summary-breakdown__item-text--text-right">{{model?.total?.totalFormatted}}</span>
</div>
