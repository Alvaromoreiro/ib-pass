<section class="ib-summary-breakdown__section ib-summary-breakdown__section--padding-small ib-summary-breakdown__section--separator u-pb-none"
    *ngIf="model.hasUpgrading">
    <header class="ib-summary-breakdown__section-header">
        <span class="ib-summary-breakdown__icon icon-sala_vip"></span>
        <h4 class="ib-summary-breakdown__section-title ib-summary-breakdown__section-title--with-icon">{{'IMPROVE_UPGRADING_CABIN_TEXT'|translate}}</h4>
    </header>
    <div *ngFor="let segment of model.segments">
        <ul class="ib-summary-breakdown__list ib-summary-breakdown__list--padding-none">
            <li class="ib-summary-breakdown__item">
                <span class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--bold ib-summary-breakdown__item-text--subtitle">
                    {{segment.origin.description}}
                    ({{segment.origin.code}}) -
                    {{segment.destination.description}}
                    ({{segment.destination.code}})
                </span>
            </li>
        </ul>
        <ul class="ib-summary-breakdown__list ib-summary-breakdown__list--padding-none ">
            <li class="ib-summary-breakdown__item">
                <div class="ib-summary-breakdown__item-description">
                    <span class="ib-summary-breakdown__item-text">{{segment.cabin}}</span>
                </div>
            </li>
        </ul>
    </div>
    <ul class="ib-summary-breakdown__list ib-summary-breakdown__list--padding-none">
        <li class="ib-summary-breakdown__item">
            <div class="ib-summary-breakdown__item-description">
                <span
                    class="ib-summary-breakdown__item-total">{{'IMPROVE_UPGRADING_CABIN_TEXT'|translate}}</span>
                <span
                    class="ib-summary-breakdown__item-text ib-summary-breakdown__item-text--bold ib-summary-breakdown__item-text--right ib-summary-breakdown__item-text--bigger">{{model.totalFormatted}}</span>
            </div>
        </li>
    </ul>
</section>
