<header class="ib-header-common ib-header-common--bottom">
    <ib-booking-header-simple *ngIf="model?.headerType !== 'DEFAULT'"></ib-booking-header-simple>
    <ib-booking-header-complete 
        [model]="model"
        [login]="login" 
        *ngIf="model?.headerType === 'DEFAULT'" 
        [numberTrips]="numberTrips" (activeSeeker)="toggleSeeker( )" 
        (mainReturn)="returnToMain( $event )" 
        (multicityReturn)="multiCityBack( $event )" 
        [isHMad]="isHMad"></ib-booking-header-complete>
</header>
