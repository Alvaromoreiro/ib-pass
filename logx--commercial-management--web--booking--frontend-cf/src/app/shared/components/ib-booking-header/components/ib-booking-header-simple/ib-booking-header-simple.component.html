<div class="ib-header">
    <div class="container">
        <div class="row">
            <div class="col-xs-12">
                <div class="ib-header__content ib-flex__row ib-flex--space-between ib-flex--align-center">
                    <div class="navbar-header">
                        <a href="{{logoUri}}" title="{{'HEADER_IBERIA_LOGO_TITLE'|translate}}" class="navbar-brand">
                            <figure class="ib-header__logo">
                                <img class="ib-header__logo-img" alt="{{'HEADER_IBERIA_LOGO_ALT'|translate}}" src="{{iconsPath}}/iberia/iberia-logo.png" />
                            </figure>
                        </a>
                        <span *ngIf="show" class="ib-header-common__text ib-header-common__text--type-4 hidden-xl hidden-lg hidden-md u-ml-xsmall u-pl-small">{{model.steps.position}}/{{model.steps.totalSteps}}</span>
                    </div>
                    <div class="ib-header__menu">
                        <a href="{{'HEADER_ONE_WORLD'| link}}" title="{{'HEADER_ONE_WORLD_LOGO_TITLE'|translate}}" class="logo-oneworld">
                            <figure class="logo-oneworld__img">
                                <img src="{{iconsPath}}/cabecera/oneworld.png" alt="{{'HEADER_ONE_WORLD_LOGO_ALT'|translate}}" />
                            </figure>
                        </a>
                    </div>
                    <div class="ib-header-common__column ib-header-common__column--right hidden-md hidden-lg hidden-xl">
                        <ib-booking-header-user-tooltip *ngIf="model?.flightType !== 'multiCityFlight' && loginInfo && loginInfo?.isLogged" [model]="loginInfo"></ib-booking-header-user-tooltip>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
