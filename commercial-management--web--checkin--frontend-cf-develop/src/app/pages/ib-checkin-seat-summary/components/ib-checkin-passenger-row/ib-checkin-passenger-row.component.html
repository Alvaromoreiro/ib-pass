<section class="seat-row">
    <div>
        <span class="gender-icon" [ngClass]="{'icon-mujer': passengerInfo.gender === 'FEMALE', 'icon-hombre': passengerInfo.gender === 'MALE', 'icon-iberia_ninos': passengerInfo.type === 'CHILD'}"></span>
        <p>{{passengerInfo.name + ' ' + passengerInfo.surname}}</p>
    </div>
    <span class="seat-number" *ngIf="passengerInfo.seat">
        <span class="seat-icon icon-asiento-business-class"></span>
        <span class="seat-text">{{'SEAT_TEXT' | translate}}</span>
        <span>{{passengerInfo.seat.row + passengerInfo.seat.column}}</span>
    </span>
</section>
