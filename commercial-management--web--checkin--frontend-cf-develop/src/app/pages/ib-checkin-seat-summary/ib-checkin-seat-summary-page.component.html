<section class="container">
    <div class="row">
        <div class="ib-checkin__container">
            <div class="col-xl-12">
                <div class="ib-layout__header ib-layout__header--title">
                    <h1 class="ib-heading ib-heading--type-1 ib-heading__title">{{ 'CKIACPT_TITLE' | translate}}</h1>
                    <h2 class="ib-heading ib-heading--font-normal ib-heading--type-6 u-color-gray-15">{{ 'CKIACPT_SUBTITLE' | translate }}</h2>
                </div>
            </div>
        </div>
    </div>
    <div class="segments-container">
        <ng-container *ngFor="let segment of segmentsSummary">
            <ib-checkin-segment-summary [segmentInfo]="segment" />
        </ng-container>
    </div>
    <div class="buttons">
        <button class="ib-button ib-button--block ib-button--w-big ib-button--red button-icon"
            (click)="goTo('ckianc')">
            {{'IBCOACII_CONTINUAR' | translate}}
        </button>
    </div>
</section>
