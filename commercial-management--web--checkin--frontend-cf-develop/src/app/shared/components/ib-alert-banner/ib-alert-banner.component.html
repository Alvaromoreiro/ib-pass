<div class="banner-container" [ngClass]="['banner-container--' + variant, 'banner-container--' + variantStyle, className]">
    <div class="info-container">
        <i class="icon" [ngClass]="[getIconName(), 'icon--' + variant]" aria-hidden="true"></i>
        <div class="content">
            <p class="ib-msg-alert__text ib-msg-alert__text--bold banner-title">{{ heading | translate }}</p>
            <p class="ib-msg-alert__text ib-msg-alert__text text-content">{{ body | translate }}</p>
        </div>
    </div>
    <div class="link-container" *ngIf="link">
        <a [href]="link" class="link" target="_blank" [ariaLabel]="linkAccessibleText | translate">{{ linkText | translate }}</a>
        <i class="icon-flecha_1_derecha" aria-hidden="true"></i>
    </div>
</div>
