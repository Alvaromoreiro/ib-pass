<fieldset class="ib-popover__choose-sex">
  <legend class="hidden">{{'IBCOAC_PA_GENDER_TITLE'|translate}}</legend>
  <label [for]="'IBCOAC_RADIO_MALE_' + index" class="ib-popover__choose-sex-radio">
      <input type="radio" [name]="'sex_' + index" [id]="'IBCOAC_RADIO_MALE_' + index" [(ngModel)]="passengerInfo.gender" value="MALE" class="ib-popover__choose-sex-input"/>
      <span class="ib-popover__choose-sex-text">{{'IBCOAC_PASS_HOMBRE'|translate}}</span>
    </label>
  <label [attr.for]="'IBCOAC_RADIO_FEMALE_' + index" class="ib-popover__choose-sex-radio">
      <input type="radio" [name]="'sex_' + index" [id]="'IBCOAC_RADIO_FEMALE_' + index" [(ngModel)]="passengerInfo.gender" value="FEMALE" class="ib-popover__choose-sex-input"/>
      <span class="ib-popover__choose-sex-text">{{'IBCOAC_PASS_MUJER'|translate}}</span>
    </label>
</fieldset>
