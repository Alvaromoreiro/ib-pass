<div ib-resize-banners data-ng-if="bannerCtrl.showAds">
    <div ng-if="bannerCtrl.addOnType === 0" class="ib-banner ib-banner--vertical u-width-full" id='banner_adds_728_90' ng-init="bannerCtrl.initAddOn()"></div>
    <div ng-if="bannerCtrl.addOnType === 1" class="ib-banner ib-banner--vertical ib-flex--basis-100-mobile" id='banner_adds_300_250' ng-init="bannerCtrl.initAddOn()"></div>
    <div ng-if="bannerCtrl.addOnType === 2" class="ib-banner ib-banner--vertical" id='banner_adds_300_600' ng-init="bannerCtrl.initAddOn()"></div>
    <div ng-if="bannerCtrl.addOnType === 3" class="ib-banner ib-banner--vertical" id='banner_adds_160_600' ng-init="bannerCtrl.initAddOn()"></div>
</div>
