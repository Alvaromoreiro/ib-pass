<div class="ib-select-date" id="PASSENGER_BIRTH_DATE" data-ng-class="{'ib-select-date--error': pasBirthCtrl.containerForm.$submitted && (pasBirthCtrl.containerForm['birthDateDay_'+pasBirthCtrl.index].$invalid || pasBirthCtrl.containerForm['birthDateMonth_'+pasBirthCtrl.index].$invalid || pasBirthCtrl.containerForm['birthDateYear_'+pasBirthCtrl.index].$invalid),'ib-select-date--disabled':pasBirthCtrl.haveBirthDate}">
    <span class="ib-select-date__label">{{'BIRTHDATE_FIELD_LABEL' | translate}}</span>
    <ui-select class="ib-select-date__action ib-select-date__action--day" data-ng-model="pasBirthCtrl.day" data-ng-change="pasBirthCtrl.daysSelected()"
        ng-required="pasBirthCtrl.isRequired" name="birthDateDay_{{pasBirthCtrl.index}}" ng-disabled="pasBirthCtrl.haveBirthDate"
        uis-open-close="pasBirthCtrl.onOpenClose(isOpen,'ib-select-date__action--day')">
        <ui-select-match class="ib-select-date__list-ipt" placeholder="{{'BIRTH_DATE_FIELD_DAY_PLACEHOLDER' | translate}}">
            <span class="ib-select-date__txt" data-ng-bind="$select.selected"></span>
        </ui-select-match>
        <ui-select-choices class="ib-select-date__list" repeat="item in (pasBirthCtrl.availableDays | filter: $select.search)">
            <span class="ib-select-date__list-txt" ng-bind="::item"></span>
        </ui-select-choices>
    </ui-select>
    <ui-select class="ib-select-date__action ib-select-date__action--month" data-ng-model="pasBirthCtrl.month" data-ng-change="pasBirthCtrl.monthsSelected()"
        ng-required="pasBirthCtrl.isRequired" name="birthDateMonth_{{::pasBirthCtrl.index}}" ng-disabled="pasBirthCtrl.haveBirthDate"
        uis-open-close="pasBirthCtrl.onOpenClose(isOpen,'ib-select-date__action--month')">
        <ui-select-match class="ib-select-date__list-ipt" placeholder="{{'BIRTH_DATE_FIELD_MONTH_PLACEHOLDER' | translate}}">
            <span class="ib-select-date__txt" data-ng-bind="$select.selected"></span>
        </ui-select-match>
        <ui-select-choices repeat="item in (pasBirthCtrl.availableMonths | filter: $select.search)">
            <span class="ib-select-date__list-txt" data-ng-bind="::item"></span>
        </ui-select-choices>
    </ui-select>
    <ui-select class="ib-select-date__action ib-select-date__action--year" data-ng-model="pasBirthCtrl.year" data-ng-change="pasBirthCtrl.yearsSelected()"
        ng-required="pasBirthCtrl.isRequired" name="birthDateYear_{{::pasBirthCtrl.index}}" ng-disabled="pasBirthCtrl.haveBirthDate"
        uis-open-close="pasBirthCtrl.onOpenClose(isOpen,'ib-select-date__action--year')">
        <ui-select-match class="ib-select-date__list-ipt" placeholder="{{'BIRTH_DATE_FIELD_YEAR_PLACEHOLDER' | translate}}">
            <span class="ib-select-date__txt" data-ng-bind="$select.selected"></span>
        </ui-select-match>
        <ui-select-choices repeat="item in (pasBirthCtrl.availableYears | filter: $select.search)">
            <span class="ib-select-date__list-txt" data-ng-bind="::item"></span>
        </ui-select-choices>
    </ui-select>
</div>
<div ng-messages="pasBirthCtrl.containerForm.$submitted && ((pasBirthCtrl.containerForm['birthDateDay_'+pasBirthCtrl.index].$invalid && pasBirthCtrl.containerForm['birthDateDay_'+pasBirthCtrl.index].$error)
    || (pasBirthCtrl.containerForm['birthDateMonth_'+pasBirthCtrl.index].$invalid && pasBirthCtrl.containerForm['birthDateMonth_'+pasBirthCtrl.index].$error)
    || (pasBirthCtrl.containerForm['birthDateYear_'+pasBirthCtrl.index].$invalid && pasBirthCtrl.containerForm['birthDateYear_'+pasBirthCtrl.index].$error))">
    <div class="ib-alert ib-alert--error" ng-message="required">{{'BIRTHDAY_REQUIRED_ERROR' | translate}}</div>
</div>
