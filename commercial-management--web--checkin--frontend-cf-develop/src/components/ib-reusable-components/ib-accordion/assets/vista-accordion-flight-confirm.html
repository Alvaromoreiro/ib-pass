<uib-accordion class="ibe-accordion">
  <div uib-accordion-group is-open="fnCoPaCtrl.isOpen">
    <uib-accordion-heading>
      <div class="ibe-info__box-container"><span class="ibe-accordion__title">{{fnCoPaCtrl.model.segmentInfo.type !=='OPEN' ? ('IBFNCOPA_ACCORDION_TITLE'|translate) : ('IBFNCOPA_ACCORDION_TITLE_OPEN'|translate) }}</span></div>
    </uib-accordion-heading>            
    <div class="ibe-accordion__body">
      <h4 class="ibe-info__box-title ibe-info--icon-confirmation">{{fnCoPaCtrl.model.segmentInfo.type !=='OPEN' ? ('IBFNCOPA_ACCORDION_TITLE'|translate) : ('IBFNCOPA_ACCORDION_TITLE_OPEN'|translate) }}</h4>
      <label class="ibe-info__box-description">{{'IBFNCOPA_ACCORDION_BODY'|translate}}</label>
    </div>
  </div>
</uib-accordion>
