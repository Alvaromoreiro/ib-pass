<fieldset class="ib-popover__choose-sex">
  <legend class="hidden">{{'IBCOAC_PA_GENDER_TITLE'|translate}}</legend>
  <label for="IBCOAC_RADIO_MALE_{{::pasInfoCtrl.index}}" class="ib-popover__choose-sex-radio">
      <input type="radio" name="sex_{{::pasInfoCtrl.index}}" id="IBCOAC_RADIO_MALE_{{::pasInfoCtrl.index}}" data-ng-model="pasInfoCtrl.passengerInfo.gender" value="MALE" class="ib-popover__choose-sex-input"/>
      <span class="ib-popover__choose-sex-text">{{'IBCOAC_PASS_HOMBRE'|translate}}</span>
    </label>
  <label for="IBCOAC_RADIO_FEMALE_{{::pasInfoCtrl.index}}" class="ib-popover__choose-sex-radio">
      <input type="radio" name="sex_{{::pasInfoCtrl.index}}" id="IBCOAC_RADIO_FEMALE_{{::pasInfoCtrl.index}}" data-ng-model="pasInfoCtrl.passengerInfo.gender" value="FEMALE" class="ib-popover__choose-sex-input"/>
      <span class="ib-popover__choose-sex-text">{{'IBCOAC_PASS_MUJER'|translate}}</span>
    </label>
</fieldset>
