<header class="ib-modals__header ib-modals__header--p-medium">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--full ib-heading--type-1">{{'BIOMETRIC_BOARDING_FACIAL_RECOGNITION_NOT_ACTIVATED' | translate}}</h2>
    </div>
    <div class="ib-modals__header-settings">
        <button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">{{'GENERIC_MODAL_ACCESSIBLE_CLOSE'|translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--smedium">
        <p class="ib-text">{{'BIOMETRIC_BOARDING_FACIAL_RECOGNITION_BODY_TEXT' | translate}}
        </p>
    </div>
    <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
        <p class="ib-text">
            {{'BIOMETRIC_BOARDING_FACIAL_RECOGNITION_BODY_TEXT_2' | translate}}
        </p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left u-mb-none">
            <button class="ib-button ib-button--w-big-special  ib-button--big-special" type="button" ng-click="modalCtrl.eventEmit('biometricNotActivated')">{{'IBECBP_MODAL_END' | translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right u-mt u-mb">
            <a href="javascript:void(0)" title="{{'HEADER_CONFIRMATION_BACK_MODAL_LINK'| translate}}" class="ib-link" ng-click="modalCtrl.returnBiometricModal()">{{'HEADER_CONFIRMATION_BACK_MODAL_LINK'| translate}}</a>
        </div>
    </div>
</footer>
