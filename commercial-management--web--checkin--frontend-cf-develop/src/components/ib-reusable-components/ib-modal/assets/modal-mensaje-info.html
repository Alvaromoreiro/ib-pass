<div class="ibe-modal">
  <div class="modal-header">
    <h3 class="ibe-modal_title">{{'MOD_INFO_TITLE'|translate}}</h3>
  </div>
  <div class="modal-body">
    <div class="ibe-modal_body">
      <p class="ibe-modal_body-text ibe-modal_body-text--error">{{modalCtrl.errorMessage()}}</p>
    </div>
  </div>
  <div class="modal-footer">
    <button id="MOD_INFO_BOTON_ACEP" title="{{'MOD_INFO_ACCEPT'|translate}}" class="ibe-modal_footer-callme ibe-button ibe-button--red ibe-button--big"
      data-ng-click="modalCtrl.close()">{{'MOD_INFO_ACCEPT'|translate}}</button>
  </div>
</div>
