<div class="ib-biometric-boarding-available-modal">
    <header class="ib-modals__header">
        <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
            <span class="ib-heading__icon ib-heading__icon--default icon-confirmacion"></span>
            <h2 class="ib-heading ib-heading--type-1">
                <span class="ib-heading__text">{{'BIOMETRIC_BOARDING_READY_MODAL_TITLE' | translate}}</span>
            </h2>
        </div>
        <div class="ib-modals__header-settings">
            <button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.changeToTrue()">
                <span class="u-hide-accessible">{{'HEADER_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS' | translate}}</span>
            </button>
        </div>
    </header>
    <section class="ib-modals__body">
        <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
            <div class="ib-box ib-box--unfocused ib-box--border-narrow">
                <p class="ib-biometric-boarding-available-modal__box-title">{{'BIOMETRIC_BOARDING_FACIAL_RECOGNITION_2' | translate}}</p>
                <figure class="ib-biometric-boarding-available-modal__figure">
                    <img class="ib-biometric-boarding-available-modal__image"
                        src="{{::$root.routes.images}}/otros/reconocimiento-facial.png"
                        alt="Reconocimiento facial">
                </figure>
                <p class="ib-biometric-boarding-available-modal__box-content">{{'BIOMETRIC_BOARDING_FACIAL_AVAILABLE_TEXT' | translate}}</p>
            </div>
        </div>
    </section>
    <footer class="ib-modals__footer">
        <div class="ib-content-buttons ib-content-buttons__full-responsive ib-content-buttons--not-reversed">
            <div class="ib-content-buttons__content-left">
                <button ng-click="modalCtrl.continueCheckinBiometric(true)" class="ib-button ib-button--w-medium ib-button--big-special" type="button">{{'BIOMETRIC_BOARDING_BUTTON_ACTIVATE' | translate}}</button>
            </div>
            <div class="ib-content-buttons__content-right">
                <a  ng-click="modalCtrl.continueCheckinBiometric(false)" title="{{'BIOMETRIC_BOARDING_BUTTON_END_CHECKIN_NOT_INTERESTED' | translate}}" class="ib-link">{{'BIOMETRIC_BOARDING_BUTTON_END_CHECKIN_NOT_INTERESTED' | translate}}</a>
            </div>
        </div>

        <!-- Opción "No me interesa" -->
        <!-- <div class="ib-check">
            <input type="checkbox" class="ib-check__input" id="DO_NOT_SHOW_AGAIN_CHECK" name="do_not_show_again" ng-model="modalCtrl.doNotShowAgainBiometricModal" ng-change="modalCtrl.doNotShowAgainBiometricModalChange()" />
            <label for="DO_NOT_SHOW_AGAIN_CHECK" class="ib-check__label">
                <span class="ib-check__text">{{'BIOMETRIC_BOARDING_BUTTON_DO_NOT_SHOW_AGAIN'|translate}}</span>
            </label>
        </div> -->
    </footer>
</div>
