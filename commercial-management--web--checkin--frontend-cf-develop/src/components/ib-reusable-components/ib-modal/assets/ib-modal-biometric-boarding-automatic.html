<div class="ib-biometric-boarding-available-modal">
    <header class="ib-modals__header">
        <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
            <span class="ib-heading__icon ib-heading__icon--default icon-confirmacion"></span>
            <h2 class="ib-heading ib-heading--type-1">
                <span class="ib-heading__text">{{'BIOMETRIC_BOARDING_READY_MODAL_TITLE' | translate}}</span>
            </h2>
        </div>
        <div class="ib-modals__header-settings">
            <button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
                <span class="u-hide-accessible">{{'HEADER_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS' | translate}}</span>
            </button>
        </div>
    </header>
    <section class="ib-modals__body">
        <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
            <div class="ib-box ib-box--unfocused ib-box--border-narrow">
                <div class="ib-box-card__checked icon-confirmacion">
                    <div class="ib-box-card__shadow">
                        <span class="u-hide-accessible">Opción escogida</span> <!--Traducir-->
                    </div>
                </div>
                <p class="ib-biometric-boarding-available-modal__box-title">{{'BIOMETRIC_BOARDING_FACIAL_RECOGNITION_2' | translate}}</p>
                <figure class="ib-biometric-boarding-available-modal__figure">
                    <img class="ib-biometric-boarding-available-modal__image"
                        src="{{::$root.routes.images}}/otros/reconocimiento-facial.png"
                        alt="{{'BIOMETRIC_BOARDING_CARD_TEXT' | translate}}">
                </figure>
                <div class="ib-biometric-boarding-available-modal__box-content">
                    <p>
                        {{'BIOMETRIC_BOARDING_CARDS_TEXT' | translate}}
                    </p>
                    <p>
                       {{'BIOMETRIC_CREATED_FACIAL_RECOGNITION_PROFILE' | translate}}
                    </p>
                </div>
            </div>
        </div>
    </section>
    <footer class="ib-modals__footer u-text-right">
        <button class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.acceptBoardingCards()">{{'BIOMETRIC_BOARDING_BUTTON_END_CHECKIN' | translate}}</button>
    </footer>
</div>
