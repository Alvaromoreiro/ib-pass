<header class="ib-modals__header">
    <h2 class="ib-heading ib-heading--type-1">{{'HEADER_CONFIRMATION_BACK_MODAL_TITLE'|translate}}</h2>
    <div class="ib-modals__header-settings">
        <button id="bbki-back-header-close-btn" type="button" class="ib-modals__button-action icon-cerrar" title="{{'HEADER_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}"  ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">{{'HEADER_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing--large">
        <p class="ib-text ib-text--block">{{'HEADER_CONFIRMATION_BACK_MODAL_DESCRIPTION'|translate}}</p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
            <button id="bbki-back-header-accept-btn" class="ib-button ib-button--w-medium" type="button" title="{{'HEADER_CONFIRMATION_BACK_MODAL_ACCEPT'|translate}}" data-ng-click="modalCtrl.accept()">{{'HEADER_CONFIRMATION_BACK_MODAL_ACCEPT'|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <a id="bbki-back-header-cancel-link" class="ib-link" href="javascript:void(0)" title="{{'HEADER_CONFIRMATION_BACK_MODAL_LINK_TITLE'|translate}}" data-ng-click="modalCtrl.close()">{{'HEADER_CONFIRMATION_BACK_MODAL_LINK'|translate}}</a>
        </div>
    </div>
</footer>
