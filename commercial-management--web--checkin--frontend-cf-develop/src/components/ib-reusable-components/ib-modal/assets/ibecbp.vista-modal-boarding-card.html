
<div class="ibe-modal">
  <form action="#" method="post" class="ibe_form">
    <div class="modal-header">
      <h1 class="title title__h1 ibe-modal_title-primary">{{'IBECBP_MODAL_TITLE'|translate}}</h1>
      <h5 class="title ibe-modal_title-secondary">{{'IBECBP_MODAL_SUBTITLE'|translate}}</h5>
      <div class="ibe-modal_options"><span id="cki-modal-boarding-card-close-txt" title="ACCES_MOD_CERRAR" data-ng-click="modalCtrl.close()" class="ibe-modal_options-icon ibe-modal_options-close"></span></div>
    </div>
    <div class="modal-body">
      <div class="ibe-modal_body">
        <p class="paragraph paragraph__regular">{{'IBECBP_MODAL_BOARDING'|translate}}</p>
        <p class="paragraph paragraph__regular">{{'IBECBP_MODAL_BOARDING_TEXT'|translate}}</p>
      </div>
    </div>
    <div class="modal-footer">
      <div class="ibe-modal_footer">
        <div class="ibe-base__group-foot">
          <button id="cki-modal-boarding-card-close-btn" title="" class="ibe-base__group-submit ibe-button ibe-button--red ibe-button--big">{{'IBECBP_MODAL_END'|translate}}</button><a href="#" title="ACCES_MOD_CERRAR" data-ng-click="modalCtrl.close()" class="ibe-base__group-cancel link link__regular link__regular--underline">
            {{'IBECBP_MODAL_CLOSE'|translate}}</a>
        </div>
      </div>
    </div>
  </form>
</div>
