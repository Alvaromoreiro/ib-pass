<div class="ibe-modal">
  <div class="modal-header">
    <h3 class="title title__h1 ibe-modal_title-primary">{{'IBECBP_MODAL_TITLE'|translate}}</h3>
    <p class="title ibe-modal_title-secondary">{{'IBECBP_MODAL_SUBTITLE'|translate}}</p>
    <div class="ibe-modal_options"><span title="Cerrar" data-ng-click="modalCtrl.close()" class="ibe-modal_options-icon ibe-modal_options-close"></span></div>
  </div>
  <div class="modal-body">
    <div class="ibe-modal_body">
      <p class="ibe-modal_body-text">{{'IBECBP_MODAL_BOARDING_SMS'|translate}}</p>
      <p class="ibe-modal_body-text">{{'IBECBP_MODAL_BOARDING_TEXT'|translate}}</p>
    </div>
  </div>
  <div class="modal-footer">
    <div class="ibe-modal_footer">
      <div class="ibe-base__group-foot">
        <button id="cki-modal-boarding-card-sms-accept-btn" title="Aceptar" data-ng-click="modalCtrl.acceptBoardingCards()" class="ibe-base__group-submit ibe-button ibe-button--red ibe-button--big">{{'IBECBP_MODAL_END'|translate}}</button>
        <a id="cki-modal-boarding-card-sms-close-link" title="{{'IBCOSE_DEEPLINK_CAN'|translate}}" data-ng-click="modalCtrl.close()" class="ibe-base__group-cancel link link__regular link__regular--underline">{{'IBECBP_MODAL_CLOSE'|translate}}</a>
      </div>
    </div>
  </div>
</div>
