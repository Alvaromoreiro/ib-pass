<header class="ib-modals__header">
    <h2 class="ib-text ib-text--large ib-text--bold">{{modalCtrl.titleModal()}}</h2>
    <div class="ib-modals__header-settings">
        <button id="MOD_ERROR_LINK_CLOSE" type="button" class="ib-modals__button-action icon-cerrar"
            data-ng-click="modalCtrl.close()" title="{{'ACCES_MOD_CERRAR'|translate}}">
            <span class="u-hide-accessible">{{'MODAL_CLOSE_ACCESS'|translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
        <p class="ib-text">{{modalCtrl.errorMessage()}}</p>
        <p class="hideAccessible">{{modalCtrl.errorsCode()}}</p>
        <p class="hideAccessible">{{modalCtrl.internalErrorCode()}}</p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons ib-content-buttons--end">
        <button id="MOD_ERROR_BOTON_ACEP" title="{{'MOD_ERROR_ACEPT'|translate}}"
            class="ib-button ib-button--w-medium"
            data-ng-click="modalCtrl.close()">{{'MOD_ERROR_ACEPT'|translate}}</button>
    </div>
</footer>
