<div class="ibe-modal">
  <div class="modal-header">
    <h3 class="title title__h1 ibe-modal_title-primary">{{'IBECBP_MODAL_TITLE'|translate}}</h3>
    <p class="title ibe-modal_title-secondary">{{'IBECBP_MODAL_SUBTITLE'|translate}}</p>
    <div class="ibe-modal_options"><span id="IBECBP_MODAL_BOARDING_CERRAR" title="Cerrar" data-ng-click="modalCtrl.close()" class="ibe-modal_options-icon ibe-modal_options-close"></span></div>
  </div>
  <div class="modal-body">
    <div class="ibe-modal_body">
      <p class="ibe-modal_body-text">{{'IBECBP_MODAL_BOARDING_EMAIL'|translate}}</p>
      <p class="ibe-modal_body-text">{{'IBECBP_MODAL_BOARDING_TEXT'|translate}}</p>
      <p class="ibe-modal_body-text" ng-if="modalCtrl.model.acceptedSegment.showMessageStatus">{{modalCtrl.model.acceptedSegment.messageStatus}}</p>
    </div>
  </div>
  <div class="modal-footer">
    <div class="ibe-modal_footer">
      <div class="ibe-base__group-foot">
      <a id="IBECBP_MODAL_BOARDING_NUEVA_COPIA" title="{{'IBCOSE_DEEPLINK_CAN'|translate}}" data-ng-click="modalCtrl.close()" class="ibe-base__group-cancel link link__regular link__regular--underline">{{'IBECBP_MODAL_CLOSE'|translate}}</a>
      <button id="IBECBP_MODAL_BOARDING_ACEPTAR" title="Aceptar" data-ng-click="modalCtrl.acceptBoardingCards()" class="ibe-base__group-submit ibe-button ibe-button--red ibe-button--big">{{'IBECBP_MODAL_END'|translate}}</button>
    </div>
    </div>
  </div>
</div>
