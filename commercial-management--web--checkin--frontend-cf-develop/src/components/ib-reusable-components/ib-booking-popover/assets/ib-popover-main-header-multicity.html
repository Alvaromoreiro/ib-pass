<div class="ib-flights-message">
    <ul class="ib-flights-message__list">
        <li class="ib-flights-message__list-item" ng-repeat="data in popoverCtrl.multicityData">
            <span class="ib-flights-message__item-text ib-flights-message__item-text--small">{{data.origin}} - {{data.destination}}:</span>
            <span class="ib-flights-message__item-text ib-flights-message__item-text--small ib-flights-message__item-text--gray">{{data.date}}</span>
        </li>
        <li class="ib-flights-message__list-item">
            <span class="ib-flights-message__item-text ib-flights-message__item-text--big ib-flights-message__item-text--inline-block icon-persona"></span>
            <span class="ib-flights-message__item-text ib-flights-message__item-text--inline-block">x {{popoverCtrl.passengers}}</span>
        </li>
        <li class="ib-flights-message__list-item hidden-lg hidden-xl"><a id="cki-booking-popover-header-modify-search-multicity-link" class="ib-flights-message__link" href="javascript:void(0)" ng-click="popoverCtrl.close();popoverCtrl.showModalToAvailability(popoverCtrl.position)" title="{{'POP_OVER_MAIN_HEADER_MODIFY_SEARCH_LINK_TITLE'|translate}}">{{'POP_OVER_MAIN_HEADER_MODIFY_SEARCH_LINK'|translate}}</a></li>
    </ul>
</div>
