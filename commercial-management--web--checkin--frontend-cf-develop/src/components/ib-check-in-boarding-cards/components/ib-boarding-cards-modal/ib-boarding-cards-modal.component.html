<section class="modal-container">
    <header class="modal-container__header">
        <h2>{{ 'GOOGLE_WALLET_MODAL_TITLE' | translate }}</h2>
        <button aria-label="Cerrar modal" (click)="closeModal()" class="icon-cerrar">
        </button>
    </header>
    <div class="divider"></div>
    <h3>{{ 'GOOGLE_WALLET_MODAL_SUBTITLE' | translate }}</h3>
    <ul class="segments-list">
        <ib-segment-section *ngFor="let segment of segmentsMap" [segmentInfo]="segment"></ib-segment-section>
    </ul>
    <ib-button class="close-button" (clicked)="closeModal()" size="big">{{ 'MODAL_CLOSE' | translate }}</ib-button>
</section>
