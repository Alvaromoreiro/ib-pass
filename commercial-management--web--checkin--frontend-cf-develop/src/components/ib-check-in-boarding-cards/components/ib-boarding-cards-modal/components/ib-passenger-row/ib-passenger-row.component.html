<li class="passenger-row">
    <div class="passenger-info">
        <span class="gender-icon" [ngClass]="{
                    'icon-hombre': passengerInfo.gender === 'MALE',
                    'icon-mujer': passengerInfo.gender === 'FEMALE'
                    }"></span>
        <h5>{{ passengerInfo.name + ' ' + passengerInfo.surname }}</h5>
    </div>
    <button (click)="download()">
        <figure class="ib-boarding-cards-wallet__figure--google">
            <img [src]="googleWalletImg" alt="Logo Google Wallet" class="u-width-full" />
        </figure>
    </button>
</li>
