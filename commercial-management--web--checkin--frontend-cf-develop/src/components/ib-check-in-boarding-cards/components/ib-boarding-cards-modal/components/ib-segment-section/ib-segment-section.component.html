<li class="segment-container">
    <div class="segment-info">
        <div class="segment-info__left">
            <span class="icon-avion_arriba"></span>
            <h4>
                <span class="airport-title">{{ departureTitle }}</span> -
                <span class="airport-title">{{ arriveTitle }}</span>
            </h4>
        </div>
        <p class="segment-info__right">{{ segmentDate }}h</p>
    </div>
    <ul>
        <ib-passenger-row *ngFor="let passenger of segmentInfo.passengers" [passengerInfo]="passenger" (downloadGWEvent)="downloadGW($event)"></ib-passenger-row>
    </ul>
</li>
