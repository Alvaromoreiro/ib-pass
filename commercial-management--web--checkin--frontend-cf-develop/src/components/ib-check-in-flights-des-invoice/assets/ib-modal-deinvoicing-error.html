<header class="ib-modals__header">
        <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
            <h2 class="ib-heading ib-heading--type-1">{{'DE_INVOICING_MODAL_ERROR_TITLE'|translate}}</h2>
        </div>
        <div class="ib-modals__header-settings">
            <button id="cki-flights-des-invoice-modal-deinvoicing-error-close-btn" type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
                <span class="u-hide-accessible">{{'DE_INVOICING_MODAL_ERROR_CLOSE_MODAL'|translate}}</span>
            </button>
        </div>
    </header>
    <section class="ib-modals__body">
        <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
            <p class="ib-text ib-text--color-unfocused">{{modalCtrl.model.reason}}</p>
        </div>
    </section>
    <footer class="ib-modals__footer">
        <div class="ib-content-buttons">
            <div class="ib-content-buttons__content-left">
                <button id="cki-flights-des-invoice-modal-deinvoicing-error-accept-link" class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.accept()">{{'DE_INVOICING_MODAL_ERROR_RETRY'|translate}}</button>
            </div>
            <div class="ib-content-buttons__content-right">
                <a id="cki-flights-des-invoice-modal-deinvoicing-error-close-link" href="#" title="{{'DE_INVOICING_MODAL_ERROR_EXIT_MODAL'|translate}}" class="ib-link">{{'DE_INVOICING_MODAL_ERROR_EXIT_MODAL'|translate}}</a>
            </div>
        </div>
    </footer>
