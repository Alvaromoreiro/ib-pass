<div class="ib-main-steps">
  <div class="container">
    <div class="row">
      <div class="col-xs-12 ib-main-steps__scroll">
        <ul class="ib-main-steps__list">
          <li
            class="ib-main-steps__item"
            ng-repeat="(index,step) in ibUiStepsCtrl.steps"
          >
            <span
              class="ib-main-steps__txt"
              data-ng-class="{'ib-main-steps__txt--active': step.isActive}"
              ng-if="ibUiStepsCtrl.showNumbers"
              >{{index+1}}. {{step.name}}</span
            >
            <span
              class="ib-main-steps__txt"
              data-ng-class="{'ib-main-steps__txt--active': step.isActive}"
              ng-if="!ibUiStepsCtrl.showNumbers"
              >{{step.name}}</span
            >
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
