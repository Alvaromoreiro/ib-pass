<div
  class="ib-ui-titles ib-ui-titles-{{uiTitlesCtrl.type}} {{uiTitlesCtrl.modifier}}"
  ng-switch="uiTitlesCtrl.type"
>
  <div class="ib-ui-titles__container" ng-switch-default>
    <span
      data-ng-if="uiTitlesCtrl.icon"
      class="ib-ui-titles-icon {{uiTitlesCtrl.icon}}"
    ></span>
    <figure class="ib-ui-titles-icon" ng-if="uiTitlesCtrl.iconImage">
      <img
        ng-src="{{uiTitlesCtrl.iconImage}}"
        class="ib-ui-titles-icon"
        alt="{{uiTitlesCtrl.iconImageAlt}}"
      />
    </figure>
    <div class="ib-ui-titles__content">
      <h3 class="ib-ui-titles-title">{{uiTitlesCtrl.titleText | translate}}</h3>
      <p class="ib-ui-titles-subtitle" data-ng-if="uiTitlesCtrl.subtitle">
        {{uiTitlesCtrl.subtitle | translate}}
      </p>
    </div>
  </div>
</div>
