<div class="ib-modals__overlay" (click)="close()"></div>

<div
  class="ib-modals ib-modals--otp-error"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="otp-error-modal-title"
  aria-describedby="otp-error-modal-subtitle"
>

  <header class="otp-error-header">
    <div class="otp-error-close-container">
      <button
        id="otp-error-modal-close-btn"
        type="button"
        class="ib-modals__button-action icon-cerrar"
        [title]="'GENERIC_MODAL_ACCESSIBLE_CLOSE' | translate"
        [attr.aria-label]="'GENERIC_MODAL_ACCESSIBLE_CLOSE' | translate"
        (click)="close()"
      >
        <span class="u-hide-accessible">{{ 'GENERIC_MODAL_ACCESSIBLE_CLOSE' | translate }}</span>
      </button>
    </div>
  </header>

  <section class="ib-modals__body otp-error-body">

    <div class="otp-error-icon-outer" aria-hidden="true">
      <div class="otp-error-icon-inner">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <path d="M22.2451 5.39294C21.6947 4.69973 19.1767 2.18177 18.4835 1.62109C16.2612 3.40507 14.1 5.2808 12 7.24828C9.9 5.2808 7.73883 3.40507 5.5165 1.62109C4.8233 2.18177 2.30534 4.69973 1.75485 5.39294C3.52864 7.60507 5.40437 9.76624 7.37184 11.8662C5.31262 14.0478 3.35534 16.2905 1.5 18.6046C2.06068 19.2978 4.57864 21.8158 5.27184 22.3764C7.57573 20.5211 9.82864 18.5638 12 16.5148C14.1816 18.574 16.4243 20.5211 18.7282 22.3764C19.4214 21.826 21.9495 19.2978 22.5 18.6046C20.6447 16.2905 18.6874 14.0478 16.6282 11.8662C18.5956 9.76624 20.4714 7.60507 22.2451 5.39294Z" fill="white"/>
        </svg>
      </div>
    </div>

    <h2 id="otp-error-modal-title" class="otp-error-title">
      {{ 'OTP_CODE_GENERIC_ERROR_TITLE' | translate }} 
    </h2>

    <p id="otp-error-modal-subtitle" class="otp-error-subtitle">
      {{ 'OTP_CODE_GENERIC_ERROR_DESCRIPTION' | translate }}
    </p>
    <hr class="otp-error-divider" aria-hidden="true" />

    <button
      id="otp-error-modal-accept-btn"
      type="button"
      class="otp-error-accept-btn"
      [title]="'MODAL_ACCEPT' | translate"
      (click)="accept()"
    >
      {{ 'MODAL_ACCEPT' | translate }}
    </button>

  </section>

</div>
