<div class="ib-ui-travel-info">
  <div
    class="ib-ui-travel-info__travel"
    data-ng-repeat="journey in uiTravelInfoCtrl.travelInfo.journey"
  >
    <p class="ib-ui-travel-info__passengers" data-ng-if="journey.passengers">
      <span class="ib-ui-travel-info__text--bold"
        >{{'SUMMARY_PASSENGERS'|translate}}:</span
      >
      <span
        class="ib-ui-travel-info__text--bold"
        data-ng-repeat="(passIndex, passenger) in journey.passengers"
        >{{passenger|lowercase}}{{passIndex === (journey.passengers.length - 1)
        ? '' : ', '}}</span
      >
    </p>
    <div class="ib-ui-travel-info__flights">
      <div
        class="ib-ui-travel-info__flights--trip"
        data-ng-if="journey.trips"
        data-ng-repeat="(tripIndex, trip) in journey.trips"
      >
        <span
          class="ib-ui-travel-info__flights--icon"
          ng-class="{'icon-avion_vuelta': trip.type === 'return', 'icon-avion_ida': trip.type !=='return'}"
        ></span>
        <div class="ib-ui-travel-info__flights--info">
          <p class="ib-ui-travel-info__flights--travel">
            <span
              class="ib-ui-travel-info__flights--index ib-ui-travel-info__text"
              data-ng-if="uiTravelInfoCtrl.isMultiCity"
              >{{'AVAILABILITY_MULTI_TRIP_TITLE_SLICE'|translate}} {{tripIndex +
              1 + ': '}}</span
            >
            <span
              class="ib-ui-travel-info__flights--cities ib-ui-travel-info__text"
              >{{trip.formedInfo}}</span
            >
          </p>
          <p
            class="ib-ui-travel-info__flights--date ib-ui-travel-info__text"
            data-ng-if="!uiTravelInfoCtrl.isPaOpen"
          >
            {{trip.date}}
          </p>
        </div>
      </div>
    </div>
  </div>
  <div
    class="ib-ui-travel-info__claim ib-layout__line-spacing ib-layout__line-spacing--medium"
  >
    <p class="ib-ui-travel-info__text--bold">
      {{uiTravelInfoCtrl.travelInfo.moreInfoText}}
    </p>
  </div>
</div>
