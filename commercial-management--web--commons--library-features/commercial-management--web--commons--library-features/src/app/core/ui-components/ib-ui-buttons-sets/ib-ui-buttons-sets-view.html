<div class="ib-ui-buttons-sets {{uiBtnSetsCtrl.modifier}}">
  <div
    class="ib-ui-buttons-sets__content"
    data-ng-class="{'u-mt-mobile': index === 0 && uiBtnSetsCtrl.editionMode}"
    data-ng-repeat="(index, action) in uiBtnSetsCtrl.items track by $index"
    ng-switch="action.type"
  >
    <button
      ng-switch-when="button-medium"
      class="ib-button ib-button--w-medium {{action.modifier}}"
      id="{{action.id}}"
      type="button"
      title="{{action.title|translate}}"
      data-ng-click="uiBtnSetsCtrl.internalCallback($event, $index, action.id);"
      focusin
    >
      {{action.text|translate}}
    </button>

    <button
      ng-switch-when="action-button"
      class="ib-ui-buttons-sets__button {{action.modifier}}"
      id="{{action.id}}"
      type="button"
      title="{{action.title|translate}}"
      data-ng-click="uiBtnSetsCtrl.internalCallback($event, $index, action.id);"
      focusin
    >
      <span class="{{action.icon}}" data-ng-if="action.icon"></span>
      <span class="ib-ui-buttons-sets__button--text"
        >{{action.text|translate}}</span
      >
    </button>

    <a
      ng-switch-when="action-link"
      href="{{action.url}}"
      class="ib-ui-buttons-sets__button {{action.modifier}}"
      id="{{action.id}}"
      title="{{action.title|translate}}"
      data-ng-click="uiBtnSetsCtrl.internalCallback($event, $index, action.id);"
      focusin
    >
      <span class="{{action.icon}}" data-ng-if="action.icon"></span>
      <span class="ib-ui-buttons-sets__button--text"
        >{{action.text|translate}}</span
      >
    </a>

    <a
      ng-switch-default
      href="{{action.url}}"
      class="ib-link {{action.modifier}} u-pt-mobile"
      id="{{action.id}}"
      title="{{'MODAL_CANCEL_BUTTON'|translate}}"
      data-ng-click="uiBtnSetsCtrl.internalCallback($event, $index, action.id);"
      target="{{action.target}}"
      focusin
      >{{'MODAL_CANCEL_BUTTON'|translate}}</a
    >
  </div>
</div>
