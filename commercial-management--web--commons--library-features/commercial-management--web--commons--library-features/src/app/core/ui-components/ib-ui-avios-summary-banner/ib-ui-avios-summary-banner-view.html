<div class="row">
    <div class="col-xs-12">
        <section class="ib-layout__section ib-layout__section ib-box ib-box--border-narrow u-pt-small u-pb-small u-pl-small">
            <div class="ib-layout__line-spacing u-mb-none">
                <div
                    class="ib-flex ib-flex__row-nowrap ib-flex--align-center u-pt-xsmall u-pb-xsmall u-display-align-start-mobile">
                    <figure class="hidden-xs hidden-sm"><img class="u-width-auto"
                            src="/iberia-web-content/iconos/avios/new-avios-big.svg" alt="Avios"></figure>
                    <figure class="u-mr-small hidden-md hidden-lg hidden-xl"><img class="u-width-auto"
                            src="/iberia-web-content/iconos/avios/new-avios-small.svg" alt="Avios"></figure>
                    <div class="ib-flex ib-flex__column">
                        <p ng-if="ibUiAviosSummaryBannerCtrl.logged" class="ib-text ib-text--block ib-text--lh-normal">
                            {{('SBE_BANNER_ANCILLARIES_USER_LOGGED' | translate)}}
                            <a id="more-info-banner-avios-summary-link"
                                title="{{('SBE_BANNER_ANCILLARIES_MORE_INFO' | translate)}}"
                                ng-click="ibUiAviosSummaryBannerCtrl.linkPopup(('LOGGED_USER_MORE_INFO' | LinksFilter))"
                                target="_blank" rel="noopener noreferrer"
                                class="ib-link">{{('SBE_BANNER_ANCILLARIES_MORE_INFO' | translate)}}</a>
                        </p>
                        <p ng-if="!ibUiAviosSummaryBannerCtrl.logged" class="ib-text ib-text--block ib-text--lh-normal">
                            {{('SBE_BANNER_ANCILLARIES_USER_NOT_LOGGED' | translate)}}
                            <a id="more-info-banner-avios-summary-link"
                                title="{{('SBE_BANNER_ANCILLARIES_MORE_INFO' | translate)}}"
                                ng-click="ibUiAviosSummaryBannerCtrl.linkPopup(('LOGGED_USER_MORE_INFO' | LinksFilter))"
                                target="_blank" rel="noopener noreferrer"
                                class="ib-link">{{('SBE_BANNER_ANCILLARIES_MORE_INFO' | translate)}}</a>
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
