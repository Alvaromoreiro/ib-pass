<div ng-switch="uiLoadingCtrl.type">
  <!-- CASE GREY -->
  <div
    class="ib-ui-loading ib-ui-loading--type-5 ib-ui-loading--grey {{uiLoadingCtrl.modifier}}"
    data-ng-attr-id="{{uiLoadingCtrl.identifier}}"
    ng-switch-when="grey"
  >
    <div class="ib-ui-loading__container">
      <div class="ib-ui-loading__icon">
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <span class="ib-ui-loading__text" data-ng-if="uiLoadingCtrl.viewTitle"
        >{{uiLoadingCtrl.viewTitle|translate}}</span
      >
    </div>
  </div>
  <!-- CASE RIBBON -->
  <div
    class="ib-ui-loading ib-ui-loading--type-5 ib-ui-loading--grey {{uiLoadingCtrl.modifier}}"
    data-ng-attr-id="{{uiLoadingCtrl.identifier}}"
    ng-switch-when="ribbon"
    ib-calendar-slides-loading
  >
    <div class="ib-ui-loading__container">
      <div class="ib-ui-loading__icon">
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <span class="ib-ui-loading__text" data-ng-if="uiLoadingCtrl.viewTitle"
        >{{uiLoadingCtrl.viewTitle|translate}}</span
      >
    </div>
  </div>
  <!-- CASE DARK -->
  <div
    class="ib-ui-loading {{uiLoadingCtrl.modifier}}"
    data-ng-id="{{uiLoadingCtrl.identifier}}"
    ng-switch-when="dark"
  >
    <div class="ib-ui-loading__container">
      <div class="ib-ui-loading__icon">
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <span class="ib-ui-loading__text" data-ng-if="uiLoadingCtrl.viewTitle"
        >{{uiLoadingCtrl.viewTitle|translate}}</span
      >
    </div>
  </div>
  <!-- CASE SMALL-IN -->
  <div
    class="ib-ui-loading ib-ui-loading--small-in {{uiLoadingCtrl.modifier}}"
    data-ng-id="{{uiLoadingCtrl.identifier}}"
    ng-switch-when="small-in"
  >
    <div class="ib-ui-loading__container">
      <div class="ib-ui-loading__icon">
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <span class="ib-ui-loading__text"
        >{{uiLoadingCtrl.viewTitle|translate}}</span
      >
    </div>
  </div>
  <!-- CASE LOADING-DOTS -->
  <div
    class="ib-ui-loading ib-ui-loading--small-in {{uiLoadingCtrl.modifier}}"
    data-ng-id="{{uiLoadingCtrl.identifier}}"
    ng-switch-when="loading-dots"
  >
    <div class="ib-ui-loading__container">
      <span class="ib-ui-loading__text"
        >{{uiLoadingCtrl.titleFormattedString}}</span
      >
    </div>
  </div>
  <!-- CASE DEFAULT -->
  <div
    class="ib-ui-loading ib-ui-loading--type-1 {{uiLoadingCtrl.modifier}}"
    data-ng-id="{{uiLoadingCtrl.identifier}}"
    ng-switch-default
  >
    <div class="ib-ui-loading__container">
      <div class="ib-ui-loading__icon">
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <span class="ib-ui-loading__text" data-ng-if="uiLoadingCtrl.viewTitle"
        >{{uiLoadingCtrl.viewTitle|translate}}</span
      >
    </div>
  </div>
</div>
