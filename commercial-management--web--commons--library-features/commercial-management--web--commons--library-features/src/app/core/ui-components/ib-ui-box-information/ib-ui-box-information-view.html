<div class="ib-layout__line-spacing ib-layout__line-spacing--small u-mt-big">
  <div
    class="ib-alertbox ib-alertbox--darkgrey"
    aria-label="{{'GENERAL_ADVICE_TITLE' | translate}}"
  >
    <div class="ib-alertbox__head">
      <span
        class="ib-alertbox__head--icon"
        data-ng-class="ibUiBoxInformationCtrl.icon ? ibUiBoxInformationCtrl.icon : 'icon-informacion'"
      >
        <span class="hide-accessible"
          >{{'GENERAL_ADVICE_TITLE' | translate}}</span
        >
      </span>
      <h3
        class="ib-alertbox__head--title"
        data-ng-if="ibUiBoxInformationCtrl.title"
      >
        {{ibUiBoxInformationCtrl.title | translate}}
      </h3>
      <h3
        class="ib-alertbox__head--title"
        data-ng-if="ibUiBoxInformationCtrl.titleText"
      >
        {{ibUiBoxInformationCtrl.titleText | translate}}
        <span
          data-ng-if="ibUiBoxInformationCtrl.serviceText"
          class="u-display-block ib-alertbox__head--title"
          >{{ibUiBoxInformationCtrl.serviceText}}</span
        >
      </h3>
    </div>
    <div
      class="ib-alertbox__content"
      data-ng-if="ibUiBoxInformationCtrl.content"
    >
      <p class="ib-alertbox__content--text">
        {{ibUiBoxInformationCtrl.content|translate}}
      </p>
    </div>
  </div>
</div>
