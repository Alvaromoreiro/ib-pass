<div class="col-sm-12 col-md-12">
  <span
    class="col-sm-10 col-md-10 col-lg-10 ib-alert-confirmation__popover-title ib-attendance-voucher--popover-info__title"
    >{{popoverCtrl.title}}</span
  >
  <button
    class="col-sm-1 col-md-1 col-lg-1 popover-close icon-cerrar"
    type="button"
    data-ng-click="popoverCtrl.close()"
  >
    <span class="u-hide-accessible">{{popoverCtrl.title}}</span>
  </button>
</div>
<p class="ib-text ib-text--color-dark">{{popoverCtrl.text}}</p>
