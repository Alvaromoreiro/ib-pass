<header class="ib-modals__header">
  <h2 class="ib-heading ib-heading--type-1">
    {{'ONHOLD_OPTION_TITLE'|translate}}
  </h2>
  <div class="ib-modals__header-settings">
    <button
      id="bbki-back-header-close-btn"
      type="button"
      class="ib-modals__button-action icon-cerrar"
      title="{{'HEADER_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}"
      ng-click="modalCtrl.close()"
    >
      <span class="u-hide-accessible"
        >{{'HEADER_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}</span
      >
    </button>
  </div>
</header>
<section class="ib-modals__body">
  <ib-booking-change-on-hold-now
    id="bbki-on-hold-options-change-on-hold-now"
    show-button="false"
  ></ib-booking-change-on-hold-now>
</section>
<footer class="ib-modals__footer">
  <div class="ib-content-buttons">
    <div class="ib-content-buttons__content-left">
      <button
        id="bbki-on-hold-now-book-btn"
        class="ib-button ib-button--w-medium"
        title="{{'ONHOLD_OPTION_BUTTON'|translate}}"
        data-ng-click="modalCtrl.acceptBuyOnhold()"
      >
        {{'ONHOLD_OPTION_BUTTON'|translate}}
      </button>
    </div>
    <div class="ib-content-buttons__content-right">
      <a
        id="bbki-on-hold-now-link"
        data-ng-click="modalCtrl.accept()"
        title="{{'ONHOLD_OPTION_NO_ACCEPT'|translate}}"
        class="ib-link"
        >{{'ONHOLD_OPTION_NO_ACCEPT'|translate}}</a
      >
    </div>
  </div>
</footer>
