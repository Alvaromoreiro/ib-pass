<header
  class="ib-modals__header ib-modals__header--inside u-pb-xmedium u-pb-xs"
>
  <h2 class="ib-heading ib-heading--type-18 ib-heading--full">
    <span class="ib-heading__text"
      >{{modalCtrl.resolve.object.title|translate}}</span
    >
  </h2>
</header>
<section class="ib-modals__body">
  <div class="ib-layout__line-spacing ib-layout__line-spacing--medium">
    <p class="ib-text ib-text--block">
      {{modalCtrl.resolve.object.body|translate}}
    </p>
  </div>
</section>
<footer class="ib-modals__footer">
  <div class="ib-content-buttons">
    <div class="ib-content-buttons__content-left u-width-auto">
      <button
        class="ib-button ib-button--w-medium"
        type="button"
        ng-click="modalCtrl.accept()"
      >
        {{modalCtrl.resolve.object.accept|translate}}
      </button>
    </div>
    <div class="ib-content-buttons__content-right u-width-auto">
      <a
        href="#"
        title="Cancelar"
        class="ib-link"
        ng-click="modalCtrl.continue()"
        >{{modalCtrl.resolve.object.cancel|translate}}</a
      >
    </div>
  </div>
</footer>
