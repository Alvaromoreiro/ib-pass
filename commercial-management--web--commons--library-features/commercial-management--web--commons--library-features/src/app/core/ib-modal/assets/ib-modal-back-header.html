<header class="ib-modals__header">
  <h2 class="ib-heading ib-heading--type-1">
    {{modalCtrl.model.backMain.header.title|translate}}
  </h2>
  <div class="ib-modals__header-settings">
    <button
      id="bbki-back-header-close-btn"
      type="button"
      class="ib-modals__button-action icon-cerrar"
      title="{{modalCtrl.model.backMain.header.btn.text|translate}}"
      ng-click="modalCtrl.close()"
    >
      <span class="u-hide-accessible"
        >{{modalCtrl.model.backMain.header.btn.title|translate}}</span
      >
    </button>
  </div>
</header>
<section class="ib-modals__body">
  <div class="ib-layout__line-spacing--large">
    <p class="ib-text ib-text--block">
      {{modalCtrl.model.backMain.body.text|translate}}
    </p>
  </div>
</section>
<footer class="ib-modals__footer">
  <div class="ib-content-buttons">
    <div class="ib-content-buttons__content-left">
      <button
        id="bbki-back-header-accept-btn"
        class="ib-button ib-button--w-medium"
        type="button"
        title="{{modalCtrl.model.backMain.btn.title|translate}}"
        data-ng-click="modalCtrl.accept()"
      >
        {{modalCtrl.model.backMain.btn.text|translate}}
      </button>
    </div>
    <div class="ib-content-buttons__content-right">
      <a
        id="bbki-back-header-cancel-link"
        class="ib-link"
        href="javascript:void(0)"
        title="{{modalCtrl.model.backMain.link.title|translate}}"
        data-ng-click="modalCtrl.close()"
        >{{modalCtrl.model.backMain.link.text|translate}}</a
      >
    </div>
  </div>
</footer>
