<header
  class="ib-modals__header ib-modals__header--inside u-pb-xmedium u-pb-xs"
>
  <h2 class="ib-heading ib-heading--type-18">
    <span class="ib-heading__text">{{'SORRY_ERROR'| translate }}</span>
  </h2>
  <div class="ib-modals__header-settings ib-modals__header-settings--type-2">
    <button
      type="button"
      class="ib-modals__button-action icon-cerrar"
      ng-click="modalCtrl.close()"
    >
      <span class="u-hide-accessible">Cerrar ventana modal</span>
    </button>
  </div>
</header>
<section class="ib-modals__body">
  <div class="ib-layout__line-spacing"></div>
  <div class="ib-layout__line-spacing ib-layout__line-spacing--medium">
    <p class="ib-text">
      {{'MY_BONUS_UNIFY_BONUS_UNIFY_FORM_ERROR_VOUCHER_GROUP'| translate }}
    </p>
  </div>
</section>
<footer class="ib-modals__footer">
  <div class="ib-content-buttons u-mt-medium ib-content-buttons--end">
    <button
      class="ib-button ib-button--w-medium"
      type="button"
      ng-click="modalCtrl.close()"
    >
      {{'MODAL_ACCEPT'| translate }}
    </button>
  </div>
</footer>
