<header
  class="ib-modals__header ib-modals__header--inside u-pb-xmedium u-pb-xs"
>
  <h2 class="ib-heading ib-heading--type-18 ib-heading--full">
    <span class="ib-heading__text">{{modalCtrl.model.title|translate}}</span>
  </h2>
</header>
<section class="ib-modals__body">
  <div class="ib-layout__line-spacing ib-layout__line-spacing--medium">
    <p class="ib-text ib-text--block">{{modalCtrl.model.body|translate}}</p>
  </div>
</section>
<ib-ui-loading ng-if="modalCtrl.isLoading"></ib-ui-loading>
<footer class="ib-modals__footer u-text-right">
  <button
    class="ib-button ib-button--w-medium"
    type="button"
    ng-click="modalCtrl.continue()"
  >
    {{modalCtrl.model.accept|translate}}
  </button>
</footer>
