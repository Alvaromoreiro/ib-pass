<div class="ib-header-common__container-top">
    <!-- Ida -->
    <span class="ib-header-common__city">
        {{flightCtrl.trip.originCode}}
    </span>
    <!-- Flechas -->
    <span ng-class="{'ib-header-common__fly-icon ib-header-common__fly-icon--one-direction icon-arrow-right': !flightCtrl.trip.dateReturnFlight,
    'ib-header-common__fly-icon ib-header-common__fly-icon--transfer icon-flechas': flightCtrl.trip.dateReturnFlight}"></span>
    <!-- Vuelta -->
    <span class="ib-header-common__city">
        {{flightCtrl.trip.destinyCode}}
    </span>
</div>
<!-- Fechas de vuelo -->
<div class="ib-header-common__container-bottom hidden-md hidden-sm hidden-xs">
    <span class="ib-header-common__date text-center">{{flightCtrl.trip.dateFlight}}</span>
</div>
