<footer class="ib-footer" ng-class="{'u-mt-none' : footerComponentCtrl.isFullWidth, 'ib-footer--fixed' : footerComponentCtrl.isFixed}">
	<div ng-class="{'container' : !footerComponentCtrl.isFullWidth}">
		<div ng-class="{'row' : !footerComponentCtrl.isFullWidth}">
			<div ng-class="{'col-xs-12' : !footerComponentCtrl.isFullWidth}">
				<div class="ib-footer__box ib-footer__box--degraded">
					<div ng-class="{'container' : footerComponentCtrl.isFullWidth}">
						<div class="row">
							<div class="col-lg-2 col-md-12 col-sm-12 col-xs-12">
								<figure class="ib-footer__box-fig hidden-md hidden-sm hidden-xs">
									<img ng-src="{{::$root.routes.icons}}/iberia/iberia-logo.png" alt="{{'FOOTER_IBERIA_LOGO_ALT'|translate}}" class="ib-footer__box-img"
									/>
								</figure>
							</div>
							<div class="col-lg-10 col-md-12 col-sm-12 col-xs-12" ng-switch = "$root.IsIBV">
								<div class="row" ng-switch-when = "true">
									<div class="col-xs-12">
										<a href="{{'ACCESSIBILITY_LINK'|LinksFilter}}" target="_blank" title="{{'FOOTER_ACCESSIBILITY_TITLE'|translate}}" class="ib-footer__box-link">{{'FOOTER_ACCESSIBILITY_TEXT'|translate}}</a>
									</div>
									<div class="col-xs-12">
										<a href="{{'DATA_PROTECTION_POLICY_LINK'|LinksFilter}}" target="_blank" title="{{'FOOTER_DATA_PROTECTION_POLICY_TITLE'|translate}}" class="ib-footer__box-link">{{'FOOTER_DATA_PROTECTION_POLICY_TEXT'|translate}}</a>
									</div>
								</div>
								<div class="row" ng-switch-default>
									<!-- <div class="col-xs-12">
										<span class="ib-footer__box-text">{{'FOOTER_PHONE_BILL_SALE_TEXT'|translate}}</span>
										<span class="ib-footer__box-text ib-footer__box-text--phone">{{footerComponentCtrl.footerModel.phoneInfo.prefix + ' ' + footerComponentCtrl.footerModel.phoneInfo.phoneNumber}}</span>
										<span class="ib-footer__box-text">{{footerComponentCtrl.footerModel.phoneInfo.text}}</span>
									</div> -->
									<div class="col-xs-12">
										<a href="{{'ACCESSIBILITY_LINK'|LinksFilter}}" target="_blank" title="{{'FOOTER_ACCESSIBILITY_TITLE'|translate}}" class="ib-footer__box-link">{{'FOOTER_ACCESSIBILITY_TEXT'|translate}}</a>
									</div>
									<div class="col-xs-12">
										<a href="{{'DATA_PROTECTION_POLICY_LINK'|LinksFilter}}" target="_blank" title="{{'FOOTER_DATA_PROTECTION_POLICY_TITLE'|translate}}" class="ib-footer__box-link">{{'FOOTER_DATA_PROTECTION_POLICY_TEXT'|translate}}</a>
									</div>
								</div>
								
							</div>
						</div>
					</div>
				</div>
				<div class="ib-footer__box ib-footer__box--copyright">
					<div ng-class="{'container' : footerComponentCtrl.isFullWidth}">
						<div class="row">
							<div class="col-xs-6">
								<span class="ib-text">{{('FOOTER_IBERIA_COPYRIGHT'|translate) + ' ' + footerComponentCtrl.year}}</span>
							</div>
							<div class="col-xs-6">
								<figure class="ib-footer__box-fig ib-footer__box-fig--to-right hidden-xl hidden-lg">
									<img ng-src="{{::$root.routes.icons}}/pie/iberia-logo-footer.png" alt="{{'FOOTER_IBERIA_LOGO_ALT'|translate}}" class="ib-footer__box-img"
									/>
								</figure>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</footer>
