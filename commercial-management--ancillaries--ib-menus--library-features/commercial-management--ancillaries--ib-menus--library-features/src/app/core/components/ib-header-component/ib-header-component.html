<div id="ib-header-component">
    <div class="ib-header-common--full-container">
        <div ib-sticky class="ib-header--basket-group">
            <div data-sticky-anchor>
                <div header-collapse out-side-click="true" data-sticky-fixed data-parent-header>
                    <!--
                     GREY BAR CONFIG
                    -->
                    <ib-grey-bar model="headerComponentCtrl.model.greyBarModel" class="ib-header-common ib-header-common--top hidden-sm hidden-xs"></ib-grey-bar>
                    <ib-header-grey-bar ng-if="false" id="scrollTopConfirmation" show-all-info="true"></ib-header-grey-bar>
                    <!--
                     RED BAR CONFIG
                    -->
                    <div data-ibtools="data-ibtools" class="ib-header-common ib-header-common--bottom">
                        <ib-header ng-if="headerComponentCtrl.model.headerModel" model="headerComponentCtrl.model.headerModel" login="headerComponentCtrl.model.greyBarModel" advanced-search="false"></ib-header>
                        <ib-main-header ng-if="false" login-info="headerComponentCtrl.model.greyBarModel"></ib-main-header>
                    </div>
                </div>
            </div>
        </div>
        <!--
         STEP BAR CONFIG
        -->
        <ib-steps class="hidden-sm hidden-xs"  ng-if="headerComponentCtrl.model.stepsModel" model = "headerComponentCtrl.model.stepsModel"></ib-steps>
    </div>
    <ib-advanced-header-search ng-if="headerComponentCtrl.flowName === 'BKI'" ng-show="true" advanced-search="" header-model='headerComponentCtrl.model.headerModel' grey-bar-model="headerComponentCtrl.model.greyBarModel"></ib-advanced-header-search>

</div>
