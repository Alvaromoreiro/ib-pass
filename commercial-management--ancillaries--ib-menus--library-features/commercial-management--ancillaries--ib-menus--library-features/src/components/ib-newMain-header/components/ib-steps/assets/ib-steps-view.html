<div class="ib-main-steps">
    <div class="container">
        <div class="row">
            <div class="col-xs-12 ib-main-steps__scroll" steps-scroll="stepsCtrl.model.position">
                <ul class="ib-main-steps__list">
                    <li ng-repeat="step in stepsCtrl.model.steps" class="ib-main-steps__item">
                        <span class="ib-main-steps__txt" ng-class="{'ib-main-steps__txt--active': stepsCtrl.model.position === step.position}">{{$index + 1}}. {{step.text|translate}}</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
