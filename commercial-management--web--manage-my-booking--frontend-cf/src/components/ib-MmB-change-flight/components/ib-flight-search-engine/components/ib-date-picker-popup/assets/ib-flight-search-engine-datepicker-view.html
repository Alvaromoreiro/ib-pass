<ul role="presentation" ib-limit-years-datepicker class="uib-datepicker-popup dropdown-menu uib-position-measure ib-datepicker" dropdown-nested ng-if="isOpen" ng-keydown="keydown($event)" ng-click="$event.stopPropagation()">
    <li ng-transclude></li>
    <li ng-if="showButtonBar" class="uib-button-bar">
        <span class="btn-group pull-left">
            <button type="button" class="btn btn-sm btn-info uib-datepicker-current" ng-click="select('today', $event)" ng-disabled="isDisabled('today')">{{ getText('current') }}</button>
            <button type="button" class="btn btn-sm btn-danger uib-clear" ng-click="select(null, $event)">{{ getText('clear') }}</button>
        </span>
        <button type="button" class="btn btn-sm btn-success pull-right uib-close" ng-click="close($event)">{{ getText('close') }}</button>
    </li>
    <li>
        <div class="ib-datepicker__footer">
            <div class="ib-datepicker__footer-left">
                <span class="ib-datepicker__footer-text">{{'FLIGHT_SEARCH_ENGINE_DATEPICKER_FOOTER'|translate}}</span>
            </div>
            <div class="ib-datepicker__footer-right">
                <span class="ib-datepicker__footer-text ib-datepicker__footer-text--unfocused">{{datePickerCtrl.today}}</span>
            </div>
        </div>
    </li>
</ul>
