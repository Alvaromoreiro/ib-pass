    <section class="container">
        <!-- Main content-->
        <div class="row">
            <div class="col-xs-12">
                <div class="ib-layout__header ib-layout__header--title">
                    <h1 class="ib-heading ib-heading--type-1">{{'FLIGHT_CONFIRMATION_TITLE'|translate}}</h1>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-xs-12">
                <ib-mmb-segment-details ng-if="confirmCtrl.model.selectedSegmentDetails" show-state="::false" show-pre-header="::true"

                    segment-model="::confirmCtrl.model.selectedSegmentDetails">

                <ib-flight-confirmation-details

                        <div class="ib-content-buttons__content-right">
                            <a href="javascript:void(0)" ng-click="confirmCtrl.backAvailability()" title="{{'FLIGHT_CONFIRMATION_CANCEL_TITLE'|translate}}" class="ib-link">{{'FLIGHT_CONFIRMATION_CANCEL'|translate}}</a>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </section>
