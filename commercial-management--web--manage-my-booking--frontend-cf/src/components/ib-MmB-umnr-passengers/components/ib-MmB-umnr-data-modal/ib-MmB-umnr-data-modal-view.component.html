<header class="ib-modals__header ">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1">{{'Servicio de acompañamiento de menores' | translate}}</h2>
    </div>
    <div class="ib-modals__header-settings">
        <button type="button" class="ib-modals__button-action icon-cerrar" (click)="closeModal()">
            <span class="u-hide-accessible">{{'GENERIC_MODAL_ACCESSIBLE_CLOSE' | translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body ">
    <div class="ib-layout__line-spacing">
        <p class="ib-text">{{'¿Por qué te pedimos estos datos?' | translate}}</p>
    </div>

    <div class="ib-layout__line-spacing">
        <button type="button" (click)="openCustodiansModal()" class="ib-button-link ib-box-cols__link icon-modificar" title="{{'Formulario responsable legal'|translate}}">{{'Formulario responsable legal'|translate}}</button>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
            <button class="ib-button" type="button" (click)="saveDataAndCloseModal()">
                {{'Aceptar' | translate}}
            </button>
        </div>
        <div class="ib-content-buttons__content-right">
            <button type="button" class="ib-link ib-link--button" (click)="closeModal()">{{'Cancelar' | translate}}
        </button>
        </div>
    </div>
</footer>
