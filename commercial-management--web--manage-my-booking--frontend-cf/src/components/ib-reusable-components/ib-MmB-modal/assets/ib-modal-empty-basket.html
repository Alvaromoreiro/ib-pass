
    <div class="ib-overlay-fly--type-6 ib-layout__line-spacing ">
     <div class="ib-overlay-fly__container ib-overlay-fly__container--top" >
        <div data-ng-if="MmBDeleteBasketModalCtrl.showLoading" id="loading" class="ib-overlay-fly__icon ">
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
        <div id="iconLoading" class="ib-overlay-fly__border" data-ng-if="MmBDeleteBasketModalCtrl.continue">
            <div id="initLoading" class="ib-overlay-fly__border-loading" ></div>
            <div id="valid" class="ib-overlay-fly__border-valid icon-confirmacion"></div>
        </div>
        <div  class="ib-overlay-fly__border" data-ng-if="MmBDeleteBasketModalCtrl.error">
            <div id="error" class="ib-overlay-fly__border-error icon-wrong"></div>
        </div>
        <span id="text" data-ng-if="MmBDeleteBasketModalCtrl.showLoading"
         class="ib-overlay-fly__text" >{{'MMB_EMPTY_BASKET_INFO_MESSAGE_EMPTY'|translate}}</span>
        <span id="text" class="ib-overlay-fly__text" data-ng-if="MmBDeleteBasketModalCtrl.continue"> 
            {{'MMB_EMPTY_BASKET_INFO_MESSAGE_SUCCESS'|translate}} 
            </span>
        <span id="text" class="ib-overlay-fly__text" data-ng-if="MmBDeleteBasketModalCtrl.error"> 
            {{'MMB_EMPTY_BASKET_INFO_MESSAGE_ERROR'|translate}}

        </div>
    </div>
    <footer class="ib-modals__footer " data-ng-if="!MmBDeleteBasketModalCtrl.showLoading">
        <div class="ib-content-buttons ib-content-buttons--center">
          <button id="MODAL_INFO_ACCEPT_BUTTON" title="{{'MODAL_ACCEPT'|translate}}" 
          class="ib-button ib-button--w-medium" 
          data-ng-click="MmBDeleteBasketModalCtrl.accept()"
          >
          {{MmBDeleteBasketModalCtrl.continue ? ('MODAL_CONTINUE'|translate) : 'MODAL_ACCEPT'|translate}}</button>
        </div>
      </footer>
