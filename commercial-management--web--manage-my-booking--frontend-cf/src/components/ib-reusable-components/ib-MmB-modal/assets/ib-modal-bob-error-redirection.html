<header class="ib-modals__header">
	<h2 class="ib-heading ib-heading--type-1 ib-modals__bob-error--title icon-informacion_2">{{'MMB_BOB_ERROR_TITLE'|translate}}</h2>
	<div class="ib-modals__header-settings">
		<button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.cancel()">
			<span class="hide-accessible">{{'FLIGHT_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}</span>
		</button>
	</div>
</header>
<section class="ib-modals__body ib-modals__bob-error--section">
	<div class="ib-modals__bob-error--text">
		<p class="ib-text">{{'MMB_BOB_ERROR_TEXT'|translate}}</p>
	</div>
    <div class="ib-modals__bob-error--img">  
		<img src="{{::$root.routes.images}}/ancillaries_nuevas/bob.svg" alt="{{'MMB_RESERVATION_HOTEL' | translate}}"/>    
    </div>
</section>
<footer class="ib-modals__footer u-text-right">
        <div class="ib-content-buttons__content-right">
			<button class="ib-button ib-button--w-medium" type="button" data-ng-click="modalCtrl.accept()">{{'MODAL_ACCEPT'|translate}}</button>
        </div>
</footer>
