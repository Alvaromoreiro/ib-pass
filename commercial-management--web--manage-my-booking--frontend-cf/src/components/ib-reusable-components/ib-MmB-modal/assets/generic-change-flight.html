<ib-header-steps class="ng-isolate-scope">
    <header class="ib-header-steps">
        <div class="container">
            <div class="row">
                <div class="col-xs-12">
                    <div class="ib-header-steps__content">
                        <div class="ib-header-steps__block--left">
                            <a focusin="" href="javascript:void(0)" title="Ir a home" class="ib-header-steps__logo" ng-click="modalCtrl.close()">
                                <figure class="ib-header-steps__fig">
                                    <img alt="Logo Iberia"
                                    data-ng-src="{{::$root.routes.images}}/logos/logo_iberia_red.svg">
                                </figure>
                            </a>
                            <div class="ib-header-steps__content--bordered">
                                <span class="ib-header-steps__txt">{{'CHANGE_FLIGTH' | translate}}</span>
                                <span class="ib-header-steps__txt--short visible-sm-inline-block visible-xs-inline-block">1/3</span>
                            </div>
                        </div>
                        <div class="ib-header-steps__block--right">
                            <a href="javascript:void(0)" class="ib-header-steps__link icon-cerrar" ng-click="modalCtrl.showGenericModalByModal('generic-close-change-flight.html')">{{'BACK_TO_BOOKING_MANAGEMENT' | translate}}</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="ib-main-steps ib-main-steps--flex hidden-sm hidden-xs">
            <div class="container">
                <div class="row">
                    <div class="col-xs-12 ib-main-steps__scroll">
                        <ul class="ib-main-steps__list--flex" steps-scroll="">
                            <li class="ib-main-steps__item--flex">
                                <span class="ib-main-steps__txt--flex ib-main-steps__txt--active">{{'1_SELECTION_OF_FLIGHTS' | translate}}</span>
                            </li>
                            <li class="ib-main-steps__item--flex">
                                <span class="ib-main-steps__txt--flex">{{'2_PAYMENT' | translate}}</span>
                            </li>
                            <li class="ib-main-steps__item--flex">
                                <span class="ib-main-steps__txt--flex">{{'3_CONFIRMATION' | translate}}</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </header>
</ib-header-steps>
