<header class="ib-modals__header">
    <span class="ib-heading ib-heading--type-1 ib-heading--block">{{'MODAL_USER_LOGGED_TITLE'|translate}}</span>
    <span class="ib-heading ib-heading--type-1 ib-heading--block">{{modalCtrl.model.generalInfo.name}} {{modalCtrl.model.generalInfo.surname}}</span>
    <div class="ib-modals__header-settings">
        <button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">{{'GENERIC_MODAL_ACCESSIBLE_CLOSE'|translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout">
        <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
            <span class="ib-heading ib-heading--type-3 ib-heading--block">{{'MODAL_USER_LOGGED_TEXT_1'|translate}}</span>
            <span class="ib-heading ib-heading--type-3 ib-heading--block">{{modalCtrl.model.generalInfo.avios | aviosFormatter}} {{'MENU_BAR_AVIOS'|translate}}</span>
        </div>
    </div>
</section>
