<header class="ib-modals__header">
	<h2 class="ib-heading ib-heading--type-1">{{(modalCtrl.model.title ? modalCtrl.model.title : 'ERROR_CODE_TITLE_500') | translate}}</h2>
	<div class="ib-modals__header-settings">
		<button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
			<span class="hide-accessible">{{'FLIGHT_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}</span>
		</button>
	</div>
</header>
<section class="ib-modals__body">
	<div class="ib-layout__line-spacing--small">
		<p class="ib-text">{{modalCtrl.model.message ? modalCtrl.model.message : ('ERROR_CODE_500'|translate)}}</p>
	</div>
</section>
<footer class="ib-modals__footer">
	<div class="ib-content-buttons ib-content-buttons--end">
		<button class="ib-button ib-button--w-medium" type="button"
			data-ng-click="modalCtrl.close()">{{'MODAL_ACCEPT'|translate}}</button>
	</div>
</footer>
