<header class="ib-modals__header">
	<h2 class="ib-heading ib-heading--type-1">{{'ERROR_CODE_TITLE_500'|translate}}</h2>
	<div class="ib-modals__header-settings">
		<button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
			<span class="hide-accessible">{{'FLIGHT_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}</span>
		</button>
	</div>
</header>
<section class="ib-modals__body">
	<div class="ib-layout__line-spacing--small">
		<p class="ib-text">{{'ERROR_CODE_500'|translate}}</p>
	</div>
</section>
<footer class="ib-modals__footer u-text-right">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
			<button class="ib-button ib-button--w-medium" type="button"
				data-ng-click="modalCtrl.close()">{{'MMB_TRY_AGAIN'|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
			<a class="ib-link u-mt-small u-float-left" href="javascript:void(0)"
				data-ng-click="modalCtrl.tryAgain()">{{'MODAL_CANCEL'|translate}}</a>
        </div>
    </div>
</footer>
