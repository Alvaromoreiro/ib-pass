<header class="ib-modals__header">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1 mmb-modal-deinvoicing-warning__title">
            {{modalCtrl.model.title ? (modalCtrl.model.title | translate) : 'MODAL_ERROR_TITLE' | translate}}
        </h2>
    </div>
    <div class="ib-modals__header-settings" data-ng-if="!modalCtrl.model.hideClose">
        <button type="button" class="ib-modals__button-action icon-cerrar" data-ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">{{'MODAL_CLOSE_ACCESS' | translate}}</span>
        </button>
    </div>
</header>
<section >
    <div class="ib-layout__line-spacing">
        <p class="ib-text mmb-modal-deinvoicing-warning__body">
            {{modalCtrl.model.body | translate}}
        </p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons ib-content-buttons--end">
        <button class="ib-button ib-button--w-medium"
                type="button"
                data-ng-click="modalCtrl.accept()">
            {{modalCtrl.model.accept ? (modalCtrl.model.accept | translate) : ('MODAL_ACCEPT' | translate)}}
        </button>
    </div>
</footer>
