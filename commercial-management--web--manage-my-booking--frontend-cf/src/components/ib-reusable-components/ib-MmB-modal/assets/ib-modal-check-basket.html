<header class="ib-modals__header">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1">{{'MODAL_CHECK_BASKET_TITLE'|translate}}</h2>
    </div>
    <div class="ib-modals__header-settings">
        <button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">Cerrar ventana modal</span>
        </button>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
        <p class="ib-text">{{'MODAL_CHECK_BASKET_TEXT'|translate}}</p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left u-mb-none">
            <button class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.emitGoToPaymentPage()" focusin>{{'PAY_BUTTON_TEXT'|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right u-mt u-mb">
            <a href="javascript:void(0)" title="{{'MODAL_CHECK_BASKET_LINK'|translate}}" class="ib-link" ng-click="modalCtrl.deletePendingAncillariesBasket()" focusin>{{'MODAL_CHECK_BASKET_LINK'|translate}}</a>
        </div>
    </div>
</footer>
