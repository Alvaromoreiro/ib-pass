<header class="ib-modals__header">
	<h2 class="ib-heading ib-heading--type-1">{{'MMB_ALERT_IMPORTANT'|translate}}</h2>
	<h2 class="ib-heading ib-heading--type-4">{{'MMB_ALERT_REDIRECT_GOTO' | translate}} {{modalCtrl.model.company}} {{'MMB_ALERT_REDIRECT_SEATS' | translate}}</h2>
	<div class="ib-modals__header-settings">
		<button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
			<span class="hide-accessible">{{'FLIGHT_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}</span>
		</button>
	</div>
</header>
<section class="ib-modals__body">
	<div class="ib-layout__section ib-layout__section--big">
		<p class="ib-text">{{'MM_ALERT_REDIRECT_INFO'|translate}}</p>
	</div>
</section>
<footer class="ib-modals__footer u-text-right">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
			<button class="ib-button ib-button--w-medium" type="button" data-ng-click="modalCtrl.redirect(modalCtrl.model.jbaLink)">{{'MODAL_ACCEPT'|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
			<a class="ib-link u-mt-small u-float-left" href="javascript:void(0)" data-ng-click="modalCtrl.close()">{{'FLIGHT_CONFIRMATION_CANCEL'|translate}}</a>
        </div>
    </div>
</footer>
