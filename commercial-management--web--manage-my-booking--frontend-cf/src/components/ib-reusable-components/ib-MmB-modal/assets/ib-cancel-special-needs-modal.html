<div class="ib-modals">
    <header class="ib-modals__header">
        <h2 class="ib-heading ib-heading--type-1">{{'CANCEL_SPECIAL_NEEDS_MODAL_HEADING'|translate}}</h2>
        <div class="ib-modals__header-settings">
            <button type="button" class="ib-modals__button-action icon-cerrar" data-ng-click="modalCtrl.close()">
				<span class="hide-accessible">{{'CANCEL_SPECIAL_NEEDS_MODAL_LINK_CANCEL_TITLE'|translate}}</span>
			</button>
        </div>
    </header>
    <section class="ib-modals__body">
        <form name="confidentForm" class="ib-form" novalidate>
            <div class="ib-ticket-flights ib-ticket-flights--basic">
                <fieldset class="ib-form__fieldset">
                    <legend class="u-hide-accessible">{{'CANCEL_SPECIAL_NEEDS_MODAL_LEGEND_HIDE'|translate}}</legend>
                    <div class="ib-layout__line-spacing ib-layout__line-spacing--xmedium">
                        <p class="ib-text ib-text--color-unfocused">{{'CANCEL_SPECIAL_NEEDS_MODAL_TEXT'|translate}}</p>
                    </div>
                    <div class="ib-layout__line-spacing ib-layout__line-spacing--xmedium">
                        <div class="ib-check" data-ng-class="{ 'ib-check ib-check--error' :  confidentForm.$submitted && confidentForm.check_confirmation.$invalid}">
                            <input type="checkbox" id="check_confirmation" name="check_confirmation" class="ib-check__input" data-ng-model="modalCtrl.confirmInformation"
                                required>
                            <label for="check_confirmation" class="ib-check__label">
                            <span class="ib-check__text ib-check__text--unfocused">{{'CANCEL_SPECIAL_NEEDS_MODAL_CHECK_TEXT'|translate}}<a target="_blank" rel="noopener noreferrer" ng-href="{{'CANCEL_SPECIAL_NEEDS_MODAL_LINK'|LinksFilter}}" id="CANCEL_SPECIAL_NEEDS_MODAL_CHECK_TEXT_URL" title="{{'CANCEL_SPECIAL_NEEDS_MODAL_CHECK_TEXT_2_TITLE'|translate}}"
							 class="ib-link">{{'CANCEL_SPECIAL_NEEDS_MODAL_CHECK_TEXT_2'|translate}}</a>{{'CANCEL_SPECIAL_NEEDS_MODAL_CHECK_TEXT_3'|translate}}</span>
                     </label>
                        </div>
                        <div data-ng-messages="confidentForm.$submitted && confidentForm.check_confirmation.$error">
                            <div class="ib-alert ib-alert--error " data-ng-message="required ">{{'GENERAL_CONFIRM_REQUIRED_ERROR'|translate}}</div>
                        </div>
                    </div>
                </fieldset>
            </div>
        </form>
    </section>
    <footer class="ib-modals__footer u-text-right">
        <div class="ib-content-buttons">
            <div class="ib-content-buttons__content-left">
                <button type="submit" id="CONFIDENTIALITY_MODAL_BUTTON_NEXT" class="ib-button ib-button--w-medium ib-button--block-xs" data-ng-click="modalCtrl.acceptForm(confidentForm)"
                    title="{{'CANCEL_SPECIAL_NEEDS_MODAL_LINK_CONTINUE_TITLE'|translate}}">{{'CANCEL_SPECIAL_NEEDS_MODAL_LINK_CONTINUE'|translate}}</button>
            </div>
            <div class="ib-content-buttons__content-right">
                <a ng-href="javascript:void(0)" id="CONFIDENTIALITY_MODAL_BUTTON_BACK" data-ng-click="modalCtrl.close()" title="{{'CANCEL_SPECIAL_NEEDS_MODAL_LINK_BACK_TITLE'|translate}}"
                    class="ib-link ">{{'CANCEL_SPECIAL_NEEDS_MODAL_LINK_BACK_TEXT'|translate}}</a>
            </div>
        </div>
    </footer>
</div>
