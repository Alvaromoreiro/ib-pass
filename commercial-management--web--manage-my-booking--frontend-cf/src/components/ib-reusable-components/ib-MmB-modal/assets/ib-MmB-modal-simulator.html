<div class="ib-modals ib-modals--simulator">
  <header class="ib-modals__header">
      <h2 class="ib-heading ib-heading--type-1">{{'MMB_SVC_TITLE' | translate}}</h2>
      <div class="ib-modals__header-settings">
      </div>
  </header>
  <section class="ib-modals__body">
      <form name="confidentForm" class="ib-form" novalidate>
          <div class="ib-ticket-flights ib-ticket-flights--basic u-mt-xmedium u-mb-large">
            <p class="ib-text ib-text--bold ib-text--lh-normal">{{'MMB_SVC_MODAL_MAIN_TEXT' | translate}}</p>
            <p class="ib-text ib-text ib-text--lh-normal u-mt-xsmall" data-ng-bind-html="modalCtrl.secundaryText"></p>
          </div>
      </form>
  </section>
  <footer class="ib-modals__footer" data-ng-if="!modalCtrl.model.hideFooter">
    <div class="ib-content-buttons ib-content-buttons--end">
      <button id="MODAL_INFO_ACCEPT_BUTTON" title="{{'MODAL_ACCEPT'|translate}}" class="ib-button ib-button--w-xlarge" data-ng-click="modalCtrl.accept()">{{'MMB_SVC_CONTINUE_MODAL_BUTTON'|translate}}</button>
    </div>
  </footer>
</div>
