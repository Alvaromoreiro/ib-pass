<header class="ib-modals__header">
    <h2 class="ib-heading ib-heading--type-1">{{'MMB_NAME_CHANGE_TITTLE'|translate}}</h2>
    <div class="ib-modals__header-settings">
        <button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">{{'FLIGHT_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body ib-modals__body--cols-simple">
    <form>
        <div class="ib-layout">
            <div class="ib-layout__line-spacing">
                <span class="ib-text ib-text--block">{{'MODAL_MMB_NAME_CHANGE_INFO'|translate}}</span>
            </div>
            <div class="ib-layout__line-spacing ib-layout__line-spacing--medium ib-layout__line-spacing--bordered">
                <fieldset>
                    <legend class="u-hide-accessible">{{'MODAL_PASSENGER_DATA'|translate}}</legend>
                    <div class="container">
                        <div class="row">
                            <div class="col-md-6 col-sm-12 col-xs-12">
                                <div class="ib-layout__line-spacing">
                                    <div class="ib-input">
                                        <label class="ib-input__label" for="name" ng-class="{'ib-input__label--focus' : focused || valueInput.length}">{{'PASSENGER_INFO_NAME'|translate}}</label>
                                        <input class="ib-input__input" type="text" id="name" name="name" ng-focus="focused=true" ng-blur="focused=false" ng-model="valueInput" />
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xs-12">
                                <div class="ib-layout__line-spacing">
                                    <div class="ib-input">
                                        <label class="ib-input__label" for="surname_1" ng-class="{'ib-input__label--focus' : focused || valueInput.length}">{{'MODAL_FIRST_SURNAME'|translate}}</label>
                                        <input class="ib-input__input" type="text" id="surname_1" name="surname_1" ng-focus="focused=true" ng-blur="focused=false" ng-model="valueInput" />
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 col-sm-12 col-xs-12">
                                <div class="ib-layout__line-spacing">
                                        <div class="ib-input">
                                            <label class="ib-input__label" for="surname_2" ng-class="{'ib-input__label--focus' : focused || valueInput.length}">{{'MODAL_SECOND_SURNAME'|translate}}</label>
                                            <input class="ib-input__input" type="text" id="surname_2" name="surname_2" ng-focus="focused=true" ng-blur="focused=false" ng-model="valueInput" />
                                        </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>
            <div class="ib-layout__line-spacing">
                <div class="ib-content-buttons">
                    <div class="ib-content-buttons__cancel">
                        <a href="javascript:void(0)" title="{{'MODAL_CANCEL'|translate}}" class="ib-link hidden-sm hidden-xs" ng-click="modalCtrl.close()">{{'MODAL_CANCEL'|translate}}</a>
                        <a href="javascript:void(0)" title="{{'FLIGHT_CONFIRMATION_CANCEL'|translate}}" class="ib-link ib-link--icon hidden-xl hidden-lg hidden-md icon-flecha_1_izquierda" ng-click="modalCtrl.close()"><span class="u-hide-accessible">{{'FLIGHT_CONFIRMATION_CANCEL'|translate}}</span></a>
                    </div>
                    <div class="ib-content-buttons__total-container">
                        <div class="ib-content-buttons__total">
                            <span class="ib-text ib-text--xbig ib-text--especial hidden-xs">{{'MODAL_PRICE'|translate}}&nbsp;</span>
                            <span class="ib-text ib-text--xlarge ib-text--especial">&nbsp;0,00&euro;</span>
                        </div>
                        <button class="ib-button ib-button--w-medium u-mb-small u-float-right" ng-click="modalCtrl.close()">{{'MODAL_ACCEPT'|translate}}</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</section>
