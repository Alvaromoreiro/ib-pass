<header class="ib-modals__header">
    <h2 class="ib-heading ib-heading--type-1">{{'FLIGHT_CONFIRMATION_BACK_MODAL_TITLE'|translate}}</h2>
    <div class="ib-modals__header-settings">
        <button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
            <span class="hide-accessible">{{'FLIGHT_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing--small">
        <p class="ib-text">{{'FLIGHT_CONFIRMATION_BACK_MODAL_DESCRIPTION'|translate}}</p>
    </div>
    <div class="ib-layout__line-spacing--large">
        <p class="ib-text ib-text--block">{{'FLIGHT_CONFIRMATION_BACK_MODAL_QUESTION'|translate}}</p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
            <button class="ib-button ib-button--w-medium" type="button" data-ng-click="modalCtrl.accept()">{{'FLIGHT_CONFIRMATION_BACK_MODAL_ACCEPT'|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <a class="ib-link u-mt-small" href="javascript:void(0)" data-ng-click="modalCtrl.close()">{{'FLIGHT_CONFIRMATION_BACK_MODAL_LINK'|translate}}</a>
        </div>
    </div>
</footer>
