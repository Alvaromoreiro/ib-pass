<header class="ib-modals__header ">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1">{{'MMB_VOUCHER_REFUND_LEAVE_MODAL_TITLE' | translate}}
        </h2>
    </div>
    <div class="ib-modals__header-settings">
        <button focusin type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">{{'GENERIC_MODAL_ACCESSIBLE_CLOSE' | translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body ">
    <div class="ib-layout__line-spacing--large">
        <p ng-if="modalCtrl.model.isModalLink" class="ib-text">{{'MMB_VOUCHER_REFUND_LEAVE_MODAL_MESSAGE' | translate}}</p>
        <p ng-if="!modalCtrl.model.isModalLink" class="ib-text">{{'MMB_VOUCHER_REFUND_LEAVE_MODAL_MESSAGE_2' | translate}}</p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
            <button class="ib-button ib-text ib-text--xmedium ib-text--color-light" type="button"
                ng-click="modalCtrl.close()">{{'MMB_VOUCHER_REFUND_LEAVE_MODAL_BUTTON' | translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <a href="javascript:void(0)" title="{{'PAYMENTS_DISCOUNTS_MODAL_GO_BACK_BUTTON' | translate}}"
                class="ib-check__link ib-text ib-text--xmedium"
                ng-click="modalCtrl.closeGoHome()">{{'MMB_VOUCHER_REFUND_LEAVE_MODAL_LINK' | translate}}</a>
        </div>
    </div>
</footer>
