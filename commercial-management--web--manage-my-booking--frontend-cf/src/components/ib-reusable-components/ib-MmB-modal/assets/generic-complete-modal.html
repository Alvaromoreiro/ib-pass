<header class="ib-modals__header">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1">{{modalCtrl.model.title ? (modalCtrl.model.title|translate) : 'MODAL_ERROR_TITLE'|translate}}</h2>
    </div>
    <h3 class="ib-heading ib-heading--type-5 ib-heading--unfocused" data-ng-if="modalCtrl.model.subtitle">{{modalCtrl.model.subtitle|translate}}</h3>
    <div class="ib-modals__header-settings" data-ng-if="modalCtrl.showCloseButton">
        <button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">{{'IBPAS_MMB_PASSENGER_CONFIRMATION_BACK_MODAL_CLOSE_ACCESS'|translate}}</span>
        </button>
    </div>
</header>
<section id="{{modalCtrl.model.idModal}}" class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
        <p class="ib-text" data-ng-if="!modalCtrl.model.needsHtmlBinding">{{modalCtrl.model.body|translate}}</p>
        <p class="ib-text" data-ng-if="modalCtrl.model.needsHtmlBinding" data-ng-bind-html="modalCtrl.model.body"></p>
    </div>
    <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
        <p class="ib-text" data-ng-if="modalCtrl.model.extraBody">{{modalCtrl.model.extraBody|translate}}</p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
            <button class="ib-button ib-button--w-medium" type="button" data-ng-click="modalCtrl.accept()">{{modalCtrl.model.accept ? modalCtrl.model.accept : 'MODAL_ACCEPT' |translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <a href="javascript:void(0)" title="{{modalCtrl.model.cancel|translate}}" class="ib-link" data-ng-click="modalCtrl.close()">{{modalCtrl.model.cancel ? modalCtrl.model.cancel : 'MODAL_ACCEPT'|translate}}</a>
        </div>
    </div>
</footer>
