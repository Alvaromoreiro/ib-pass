<section class="ib-modals__body ib-modal-pre-selection-menu-on-board__cancel">
    <div class="ib-layout u-text-center">
        <div class="ib-modal-pre-selection-menu-on-board__cancel--content">
            <h2 class=" ib-modal-pre-selection-menu-on-board__cancel--title">¿Quieres cancelar tu selección?</h2>
            <hr />
            <span class="ib-modal-pre-selection-menu-on-board__cancel--subtitle">Te queda por seleccionar tu menú a
                bordo de este vuelo.</span>
            <span class="ib-modal-pre-selection-menu-on-board__cancel--text">¿Seguro que quieres finalizar e ir a
                resumen?</span>
        </div>
        <div class="ib-modal-pre-selection-menu-on-board__cancel--buttons">
            <div class="ib-content-buttons u-text-center">
                <button type="button"
                    class="ib-button ib-button--inverse ib-button--w-medium-desktop ib-button--h-xmedium"
                    ng-click="modalCtrl.close()">Finalizar Selección</button>
                <button type="button" class="ib-button ib-button--w-medium-desktop ib-button--h-xmedium"
                    ng-click="modalCtrl.close()">Continuar Selección</button>
            </div>
        </div>
    </div>
</section>
<button type="button" class="ib-modals__button-action icon-cerrar  ib-modal-pre-selection-menu-on-board__cancel--close"
    ng-click="modalCtrl.close()">
    <span class="hide-accessible ib-base__page-icon__txt">{{'GENERIC_MODAL_ACCESSIBLE_CLOSE' | translate}}</span>
</button>
