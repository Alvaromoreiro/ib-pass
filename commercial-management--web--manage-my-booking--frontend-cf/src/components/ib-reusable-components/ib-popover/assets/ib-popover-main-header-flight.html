<div class="ib-flights-message">
    <ul class="ib-flights-message__list">
        <li class="ib-flights-message__list-item">
            <span class="ib-flights-message__item-text ib-flights-message__item-text--small">{{'POP_OVER_MAIN_HEADER_OUTBOUND_FLIGHT'|translate}}</span>
            <span class="ib-flights-message__item-text ib-flights-message__item-text--small ib-flights-message__item-text--gray">{{popoverCtrl.outboundFlight}}</span>
            <span class="ib-flights-message__item-text ib-flights-message__item-text--small" ng-if="popoverCtrl.returnFlight">{{'POP_OVER_MAIN_HEADER_RETURN_FLIGHT'|translate}}</span>
            <span class="ib-flights-message__item-text ib-flights-message__item-text--small ib-flights-message__item-text--gray" ng-if="popoverCtrl.returnFlight">{{popoverCtrl.returnFlight}}</span>
        </li>
        <li class="ib-flights-message__list-item">
            <span class="ib-flights-message__item-text ib-flights-message__item-text--big ib-flights-message__item-text--inline-block icon-persona"></span>
            <span class="ib-flights-message__item-text ib-flights-message__item-text--inline-block">x {{popoverCtrl.passengers}}</span>
        </li>
    </ul>
</div>
