<div class="ib-flights-message">
    <ul class="ib-flights-message__list">
        <li class="ib-flights-message__list-item" ng-if="popoverCtrl.menu[0].path">
                <a class="ib-flights-message__link ib-flights-message__link--simple" ng-href="{{popoverCtrl.menu[0].path}}" title="{{popoverCtrl.menu[0].text}}" data-ng-click="popoverCtrl.goToPage(popoverCtrl.menu[0].link, true)">{{popoverCtrl.menu[0].text}}</a>
        </li>
        <li class="ib-flights-message__list-item" ng-if="popoverCtrl.menu[1].path">
            <a class="ib-flights-message__link ib-flights-message__link--simple" ng-href="{{popoverCtrl.menu[1].path}}" title="{{popoverCtrl.menu[1].text}}" data-ng-click="popoverCtrl.goToPage(popoverCtrl.menu[1].link, false)">{{popoverCtrl.menu[1].text}}</a>
        </li>
        <li class="ib-flights-message__list-item" ng-if="popoverCtrl.menu[1].event">
            <a class="ib-flights-message__link ib-flights-message__link--simple" title="{{popoverCtrl.menu[1].text}}" data-ng-click="popoverCtrl.callEvent(popoverCtrl.menu[1].event)">{{popoverCtrl.menu[1].text}}</a>
        </li>
        <li class="ib-flights-message__list-item" ng-if="popoverCtrl.menu[2].path">
            <a class="ib-flights-message__link ib-flights-message__link--simple" ng-href="#" title="{{popoverCtrl.menu[2].text}}">{{popoverCtrl.menu[2].text}}</a>
        </li>
    </ul>
</div>
