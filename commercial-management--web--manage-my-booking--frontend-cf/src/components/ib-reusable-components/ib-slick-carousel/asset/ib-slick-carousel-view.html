<div class="slick-carousel" ib-carousel>
    <button id="SLICK_PREV_BUTTON_{{::slickCtrl.carouselIndex}}" ng-disabled="slickCtrl.carouselOptions.prevButtonDisabled || slickCtrl.options.prevButtonDisabled" class="ib-date-carousel__button-prev" ng-class="{'ib-date-carousel__button ib-date-carousel__button-prev--narrow': slickCtrl.provider === 'AWS','ib-date-carousel__button ib-date-carousel__button-prev--medium': slickCtrl.provider !== 'AWS', 'ib-date-carousel__button-next--disabled': slickCtrl.options.prevButtonDisabled}" type="button" aria-label="Previous" tabindex="0"        role="button" ng-click="slickCtrl.previousSlide($event)">{{slickCtrl.options.prevButtonText}}</button>
    <div id="SLICK_CARROUSEL_LIST_{{::slickCtrl.carouselIndex}}" class="slick-carousel-list" ng-transclude></div>
    <button id="SLICK_NEXT_BUTTON_{{::slickCtrl.carouselIndex}}" ng-disabled="slickCtrl.carouselOptions.nextButtonDisabled || slickCtrl.options.nextButtonDisabled" class="ib-date-carousel__button-next" ng-class="{'ib-date-carousel__button ib-date-carousel__button-next--narrow': slickCtrl.provider === 'AWS', 'ib-date-carousel__button ib-date-carousel__button-next--medium': slickCtrl.provider !== 'AWS', 'ib-date-carousel__button-next--disabled': slickCtrl.options.prevButtonDisabled}" type="button" aria-label="Next" tabindex="0"        role="button" ng-click="slickCtrl.nextSlide($event)">{{slickCtrl.options.nextButtonText}}{{slickCtrl.carouselOptions.nextButtonDisabled}}</button>
</div>
