<section class="ib-layout__section">
    <div class="ib-ticket-flights">
        <div ng-if="::segmentCtrl.segmentModel.savedSuccess && segmentCtrl.showAlert" class="ib-ticket-flights__alert ib-ticket-flights__alert--valid alert fade in icon-confirmacion">
            <p class="ib-ticket-flights__alert-text">{{'IBCOAC_MMB_SEGMENT_DETAILS_SAVED_SUCCESS'|translate}}</p>
            <a href="javascript:void(0)" class="ib-ticket-flights__alert-close icon-cerrar" data-dismiss="alert" aria-label="close" title="{{'IBCOAC_MMB_SEGMENT_DETAILS_SAVED_SUCCESS_CLOSE_TITLE'|translate}}"
                id="SEGMENT_DETAILS_SAVED_SUCCESS_CLOSE">
                <span class="u-hide-accessible">{{'IBCOAC_MMB_SEGMENT_DETAILS_SAVED_SUCCESS_CLOSE'|translate}}</span>
            </a>
        </div>
        <div ng-if="segmentCtrl.showPreHeader" class="ib-ticket-flights__pre-header">
            <img class="ib-ticket-flights__pre-header--img" ng-src="{{::segmentCtrl.paIconUrl}}">
        </div>
        <div class="ib-ticket-flights__ticket">
            <ng-include src="::($root.routes.templates + 'ib-MmB-segment-details-view.html')"></ng-include>
        </div>
    </div>
</section>
