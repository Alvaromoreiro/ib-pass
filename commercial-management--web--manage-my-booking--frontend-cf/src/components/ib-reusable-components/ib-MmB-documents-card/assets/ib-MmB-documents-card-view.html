<fieldset class="ib-box-menu__section ib-box-menu__section--full">
    <legend class="u-hide-accessible">{{'MMB_YOUR_FLIGHTS_OUTBOUND_FLIGHT_LENGEND'|translate}}</legend>
    
    <!-- 2 COLS CON MAIL Y CKI ONLINE -->
    <div class="ib-mmb-dashboard__row">
        <ib-box-module-link class="ib-layout__section" data-ng-class="documentsCardCtrl.flightReminder.colSize" id="mmb-management-tab-box-module-link" link-id="documentsCardCtrl.flightReminder.linkId"
            col-size="documentsCardCtrl.flightReminder.colSize" box-size="documentsCardCtrl.flightReminder.boxSize"
            icon="documentsCardCtrl.flightReminder.icon" text="documentsCardCtrl.flightReminder.text"  is-digital-boarding="false"></ib-box-module-link>
        <ib-box-module-link class="ib-layout__section" data-ng-class="documentsCardCtrl.checkInLinkData.colSize" id="mmb-management-tab-box-module-link-2" link-id="documentsCardCtrl.checkInLinkData.linkId"
            col-size="documentsCardCtrl.checkInLinkData.colSize" box-size="documentsCardCtrl.checkInLinkData.boxSize"
            icon="documentsCardCtrl.checkInLinkData.icon" text="documentsCardCtrl.checkInLinkData.text"
            value="documentsCardCtrl.checkInLinkData.value" is-digital-boarding="false"></ib-box-module-link>
    </div>
    <!-- ALERTA -->
    <ib-ui-warnings type="documentsCardCtrl.warningTop.type" text="documentsCardCtrl.warningTop.text" icon="documentsCardCtrl.warningTop.icon" modifier="documentsCardCtrl.warningTop.modifier"></ib-ui-warnings>    

    <!-- TUS DOCUMENTOS -->
    <section class="ib-layout__section u-mt-xmedium u-width-full">
        <div class="ib-box-cols">
            <div class="ib-box-cols__header">
                <h3 class="ib-box-cols__title ib-box-cols__title--big">{{'MODULES_LINK_GO_TO_DIGITAL_BOARDING_IN_TEXT'|translate}}</h3>
            </div>
            <div>
                <div class="ib-box-cols__content">
                    <p class="ib-text">{{'MMB_DOCUMENTS_SIMPLE_MESSAGE'|translate}}</p>
                </div>
            </div>
        </div>
    </section>

    <!-- TU VUELO A... -->

    <div ng-if="documentsCardCtrl.showInfoDocuments" ng-repeat="(index, flight) in documentsCardCtrl.model.flightsWithDocuments">
        <ib-MmB-flights-card model="flight" index="index" documents="true"></ib-MmB-flights-card>
    </div>
</fieldset>
