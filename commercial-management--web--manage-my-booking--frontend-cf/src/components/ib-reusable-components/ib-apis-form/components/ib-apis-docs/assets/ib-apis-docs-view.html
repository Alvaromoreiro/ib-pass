<div class="row">
    <div class="col-md-6 col-sm-12 col-xs-12">
        <div class="ib-layout__line-spacing">
            <div class="ib-select" data-ng-class="{'ib-select--error':apisDocsCtrl.containerForm.$submitted && apisDocsCtrl.containerForm.APIS_DOC_TYPE_{{::apisDocsCtrl.idDocument}}.$invalid}">
                <label class="ib-select__label" for="APIS_DOC_TYPE_{{::apisDocsCtrl.idDocument}}" data-ng-class="apisDocsCtrl.pasDocsData.selectedDoc ? 'ib-select__label--focus' : 'ib-select__label--unfocus'">
                    {{'APIS_DOCUMENT_TYPE_FIELD'|translate}}</label>
                <ui-select class="ib-select__action" ng-model="apisDocsCtrl.pasDocsData.selectedDoc" ng-required="::apisDocsCtrl.pasDocsData.isMandatory"
                    ng-change="apisDocsCtrl.selectOption($select.selected, $select.selected.optDocuments)" input-id="APIS_DOC_TYPE_{{::apisDocsCtrl.idDocument}}"
                    name="APIS_DOC_TYPE_{{::apisDocsCtrl.idDocument}}">
                    <ui-select-match class="ib-select__list-ipt" placeholder="{{'APIS_DOCUMENT_TYPE_FIELD'|translate}}">
                        <span class="ib-select__txt" ng-bind="$select.selected.type.description"></span>
                    </ui-select-match>
                    <ui-select-choices class="ib-select__list" repeat="doc in  apisDocsCtrl.idDocument === 'REQ' ? apisDocsCtrl.pasDocsData.documents : apisDocsCtrl.pasDocsData.optDocuments">
                        <span class="ib-select__list-txt">{{::doc.type.description}}</span>
                    </ui-select-choices>
                </ui-select>
            </div>

            <div ng-messages="apisDocsCtrl.containerForm.$submitted && apisDocsCtrl.containerForm['APIS_DOC_TYPE_' + apisDocsCtrl.idDocument].$error">
                <div class="ib-alert ib-alert--error" ng-message="required">{{'APIS_DOCUMENT_TYPE_REQUIRED_ERROR'|translate}}</div>
            </div>
        </div>
    </div>
    <div class="col-md-6 col-sm-12 col-xs-12" ng-if="apisDocsCtrl.pasDocsData.selectedDoc && (apisDocsCtrl.pasDocsData.selectedDoc.requiredFields && apisDocsCtrl.pasDocsData.selectedDoc.requiredFields.indexOf('NUM_DOC') !== -1) ">
        <div class="ib-layout__line-spacing">
            <div class="ib-input" data-ng-class="{'ib-input--error' :apisDocsCtrl.containerForm.$submitted && apisDocsCtrl.containerForm.APIS_DOC_NUMBER_{{::apisDocsCtrl.idDocument}}.$invalid , 'ib-input ib-input--disabled':apisDocsCtrl.pasDocsData.selectedDoc.isSaved}">
                <label class="ib-input__label" for="APIS_DOC_NUMBER_{{::apisDocsCtrl.idDocument}}" data-ng-class="{'ib-input__label--focus' : apisDocsCtrl.docNumberFocused || apisDocsCtrl.containerForm.APIS_DOC_NUMBER_{{::apisDocsCtrl.idDocument}}.$viewValue}">
                    {{'APIS_DOCUMENT_NUMBER_FIELD_LABEL'|translate}}</label>
                <input class="ib-input__input" type="text" id="APIS_DOC_NUMBER_{{::apisDocsCtrl.idDocument}}" name="APIS_DOC_NUMBER_{{::apisDocsCtrl.idDocument}}"
                    ng-if="apisDocsCtrl.pasDocsData.selectedDoc.type.code === 'DNI' && apisDocsCtrl.pasDocsData.selectedDoc.issuerCountry === 'ES'"
                    ng-focus="apisDocsCtrl.docNumberFocused=true" ng-blur="apisDocsCtrl.docNumberFocused=false" ng-required="apisDocsCtrl.pasDocsData.selectedDoc.requiredFields.indexOf('NUM_DOC') !==1"
                    ng-model="apisDocsCtrl.pasDocsData.selectedDoc.number" ng-pattern="::$root.MmBPatterns.DOCS_PATTERN" data-ib-validator-cleaner="{{::$root.MmBPatterns.DOCS_CLEANER}}"
                    data-ib-mmb-dni-validator />
                <input class="ib-input__input" type="text" id="APIS_DOC_NUMBER_{{::apisDocsCtrl.idDocument}}" name="APIS_DOC_NUMBER_{{::apisDocsCtrl.idDocument}}"
                    ng-if="apisDocsCtrl.pasDocsData.selectedDoc.type.code !== 'DNI' || (apisDocsCtrl.pasDocsData.selectedDoc.type.code === 'DNI' && apisDocsCtrl.pasDocsData.selectedDoc.issuerCountry !== 'ES')"
                    ng-focus="apisDocsCtrl.docNumberFocused=true" ng-blur="apisDocsCtrl.docNumberFocused=false" ng-required="apisDocsCtrl.pasDocsData.selectedDoc.requiredFields.indexOf('NUM_DOC') !==1"
                    ng-model="apisDocsCtrl.pasDocsData.selectedDoc.number" ng-pattern="::$root.MmBPatterns.DOCS_PATTERN" data-ib-validator-cleaner="{{::$root.MmBPatterns.DOCS_CLEANER}}"
                    maxlength="{{::(apisDocsCtrl.pasDocsData.selectedDoc.type.code === 'DNI' || apisDocsCtrl.pasDocsData.selectedDoc.type.code === 'PSPT' ? $root.MmBPatterns.APIS_DNI_PSTS_MAX_LENGTH : $root.MmBPatterns.APIS_DOCUMENT_MAX_LENGTH)}}"
                />
            </div>
            <div ng-messages="apisDocsCtrl.containerForm.$submitted && apisDocsCtrl.containerForm['APIS_DOC_NUMBER_' + apisDocsCtrl.idDocument].$error">
                <div class="ib-alert ib-alert--error" ng-message="required">{{'GENERAL_INPUT_REQUIRED_ERROR'|translate}}</div>
                <div class="ib-alert ib-alert--error" ng-message="pattern">{{'DOC_FORMAT_ERROR'|translate}}</div>
                <div class="ib-alert ib-alert--error" ng-message="dni">{{'DOC_FORMAT_ERROR'|translate}}</div>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-6 col-sm-12 col-xs-12" ng-if="apisDocsCtrl.pasDocsData.selectedDoc && (apisDocsCtrl.pasDocsData.selectedDoc.requiredFields && apisDocsCtrl.pasDocsData.selectedDoc.requiredFields.indexOf('EXPIRY_DOC') !== -1) || apisDocsCtrl.pasDocsData.selectedDoc.isSaved">
        <div class="ib-layout__line-spacing">
            <ib-expiry-date day="apisDocsCtrl.pasDocsData.selectedDoc.expiryDate.day" show-day="true" maximum-years="100" container-form="apisDocsCtrl.containerForm"
                month="apisDocsCtrl.pasDocsData.selectedDoc.expiryDate.month" year="apisDocsCtrl.pasDocsData.selectedDoc.expiryDate.year"
                index="{{apisDocsCtrl.idDocument}}" template="ib-expiry-date-view.html" index-Id="apisDocsCtrl.idDocument"
                need-disabled="apisDocsCtrl.pasDocsData.selectedDoc.isSaved"></ib-expiry-date>
        </div>
    </div>

    <div class="col-md-6 col-sm-12 col-xs-12" ng-if="apisDocsCtrl.pasDocsData.selectedDoc && (apisDocsCtrl.pasDocsData.selectedDoc.requiredFields && apisDocsCtrl.pasDocsData.selectedDoc.requiredFields.indexOf('CNTRY_DOC') !== -1) || apisDocsCtrl.pasDocsData.selectedDoc.isSaved">
        <div class="ib-layout__line-spacing">
            <div class="ib-select" ng-class="{'ib-select--error':apisDocsCtrl.containerForm.$submitted && apisDocsCtrl.containerForm['APIS_DOC_COUNTRY_' + apisDocsCtrl.idDocument].$invalid,'ib-select ib-select--disabled':apisDocsCtrl.pasDocsData.selectedDoc.isSaved,'ib-select':!apisDocsCtrl.pasDocsData.selectedDoc.isSaved}">
                <label class="ib-select__label" for="APIS_DOC_COUNTRY_{{::apisDocsCtrl.idDocument}}" data-ng-class="apisDocsCtrl.pasDocsData.selectedDoc.issuerCountry ? 'ib-select__label--focus' : 'ib-select__label--unfocus'">
                    {{'APIS_DOCUMENT_COUNTRY_FIELD_LABEL'|translate}}
                </label>
                <ui-select class="ib-select__action" ng-if="apisDocsCtrl.idDocument === 'REQ'" ng-model="apisDocsCtrl.pasDocsData.selectedDoc.issuerCountry"
                    ng-disabled="apisDocsCtrl.pasDocsData.selectedDoc.isSaved || apisDocsCtrl.isDocCountryDisabled()" name="APIS_DOC_COUNTRY_{{::apisDocsCtrl.idDocument}}"
                    ng-required="apisDocsCtrl.pasDocsData.selectedDoc.requiredFields.indexOf('CNTRY_DOC') !== -1 &&  apisDocsCtrl.idDocument === 'REQ'">
                    <ui-select-match class="ib-select__list-ipt" placeholder="{{'APIS_DOCUMENT_COUNTRY_FIELD_LABEL'|translate }}">
                        <span class="ib-select__txt" ng-bind="$select.selected.description"></span>
                    </ui-select-match>
                    <ui-select-choices class="ib-select__list" repeat="country.code as country in apisDocsCtrl.countries | prefixCheckSpecialCharactersFilter: $select.search">
                        <span class="ib-select__list-txt" ng-bind="::country.description"></span>
                    </ui-select-choices>
                </ui-select>

                <ui-select class="ib-select__action" ng-if="apisDocsCtrl.idDocument === 'OPT' && apisDocsCtrl.pasDocsData.selectedDoc.requiredFields.indexOf('CNTRY_DOC') !== -1" ng-model="apisDocsCtrl.pasDocsData.selectedDoc.issuerCountry"
                    ng-disabled="apisDocsCtrl.pasDocsData.selectedDoc.isSaved || apisDocsCtrl.isDocCountryDisabled()" name="APIS_DOC_COUNTRY_{{::apisDocsCtrl.idDocument}}"
                    ng-required="apisDocsCtrl.pasDocsData.selectedDoc.requiredFields.indexOf('CNTRY_DOC') !== -1 &&  apisDocsCtrl.idDocument === 'REQ'">
                    <ui-select-match class="ib-select__list-ipt" placeholder="{{'APIS_DOCUMENT_COUNTRY_FIELD_LABEL'|translate }}">
                        <span class="ib-select__txt" ng-bind="$select.selected.description"></span>
                    </ui-select-match>
                    <ui-select-choices class="ib-select__list" repeat="country.code as country in apisDocsCtrl.countries | prefixCheckSpecialCharactersFilter: $select.search">
                        <span class="ib-select__list-txt" ng-bind="::country.description"></span>
                    </ui-select-choices>
                </ui-select>
            </div>
            <div ng-messages="apisDocsCtrl.containerForm.$submitted && apisDocsCtrl.containerForm['APIS_DOC_COUNTRY_' + apisDocsCtrl.idDocument].$error">
                <div class="ib-alert ib-alert--error" ng-message="required">{{'APIS_DOCUMENT_COUNTRY_REQUIRED_ERROR'|translate}}</div>
            </div>
        </div>
    </div>
</div>
