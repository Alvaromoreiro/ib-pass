<div class="ib-box-menu__section ib-box-menu__section--full ib-box-menu__section--h-full">
    <div class="ib-box-card ib-box-card--w-100 ib-box-card--type-8 ib-box-card--partner ib-flex__row">

        <div class="ib-box-card__figure"
            style="background-image: url('{{::$root.routes.images}}/partners/stopover_general.png')">
            <span class="u-hide-accessible" aria-hidden="true">{{partner.partner | translate}}</span>
        </div>
        <div class="ib-box-card__content">
            <div class=" ib-text ib-box-card__paragraph">
                <div class="ib-box-card__header--without-border-bottom">
                    <h3 class="ib-box-card__title">{{'MMB_STOPOVER_GENERAL_TITLE' | translate}}</h3>
                </div>
                <p class="ib-text ib-text--block" data-ng-bind-html="partnerBoxModuleCtrl.model.description"></p>
            </div>
            <div class="ib-box-card__button-section">
                <div class=" ib-box-card__button ib-box-card__button--auto">
                    <a class="ib-button ib-button--block-xs ib-button--default-normal" ng-click="partnerBoxModuleCtrl.redirect()" title="{{'MMB_STOPOVER_GENERAL_BUTTON' | translate}}">{{'MMB_STOPOVER_GENERAL_BUTTON' | translate}}</a>
                </div>
            </div>
        </div>
    </div>
</div>
