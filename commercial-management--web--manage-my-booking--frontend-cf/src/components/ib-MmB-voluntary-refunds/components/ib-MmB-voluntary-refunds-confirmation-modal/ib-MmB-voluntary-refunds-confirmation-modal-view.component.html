<!-- Spinner -->
<div *ngIf="showSpinner" class="ib-overlay-fly ib-overlay-fly--modal-adapted ib-overlay-fly--transparent">
    <div class="ib-overlay-fly__container">
        <div class="ib-overlay-fly__icon">
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
    </div>
</div>
<header class="ib-modals__header">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1">
            {{ 'MMB_VOLUNTARY_REFUNDS_CONFIRMATION_MODAL_TITLE' | translate }}
        </h2>
    </div>
    <div class="ib-modals__header-settings">
        <button
            type="button"
            class="ib-modals__button-action icon-cerrar"
            (click)="closeModal()"
        >
            <span class="u-hide-accessible">{{'MODAL_CLOSE' | translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--large">
        <p class="ib-text">
            {{ 'MMB_VOLUNTARY_REFUNDS_CONFIRMATION_MODAL_BODY' | translate }}
        </p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
            <button
                class="ib-button ib-button--w-medium"
                type="button"
                (click)="accept()"
            >
                {{ 'MMB_VOUCHER_REFUND_BREAKDOWN_MODAL_BUTTON_TEXT' | translate }}
            </button>
        </div>
        <div class="ib-content-buttons__content-right">
            <a
                title="{{'MODAL_CANCEL' | translate}}"
                class="ib-link"
                (click)="closeModal()"
                >{{ 'MODAL_CANCEL' | translate }}</a
            >
        </div>
    </div>
</footer>
