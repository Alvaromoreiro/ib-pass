<h4 class="ib-heading ib-heading--type-4 ib-summary__section-title" [innerHTML]="'WIDGET_YOUR_TRANSFERS_GENERAL_TITLE_BASKET'|translate"></h4>
<div class="ib-summary-item__item">
    <div class="ib-list-passengers__item-description ib-list-passengers__item-description--long ib-list-passengers__item-description--long-start u-pb-small">
        <span class="ib-text ib-text--color-unfocused">
            <span class="u-display-block">{{ model?.info.transferCar }}</span>
            <span class="u-display-block">{{ model?.info.date }}</span>
        </span>
        <span class="ib-text ib-text--color-normal"> {{ model?.info.totalFormatted }}</span>
    </div>
    <div *ngIf="model.info.dateReturn" class="ib-list-passengers__item-description ib-list-passengers__item-description--long ib-list-passengers__item-description--long-start u-pb-small">
        <span class="ib-text ib-text--color-unfocused">
            <span class="u-display-block">{{ model?.info.transferCar }}</span>
            <span class="u-display-block">{{ model?.info.dateReturn }}</span>
        </span>
        <span class="ib-text ib-text--color-normal"> {{ model?.info.totalFormattedReturn }}</span>
    </div>
</div>
<div class="ib-summary__subtotal ib-summary__subtotal--separator">
    <span class="ib-text ib-text--block ib-text--bold" [innerHTML]="'HEADER_BASKET_GLOBICK_TRANSFER_AMOUNT'|translate"></span>
    <span class="ib-text ib-text--block ib-text--bold">{{ model?.total.totalFormatted}}</span>
</div>
