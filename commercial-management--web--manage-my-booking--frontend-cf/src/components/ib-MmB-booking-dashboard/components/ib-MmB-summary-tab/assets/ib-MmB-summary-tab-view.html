<div class="ib-layout__line-spacing u-text-center hidden-xl hidden-lg">
    <h2 class="ib-heading ib-heading--title-box">{{'MMB_MENU_SUMMARY_OPTION_TEXT'|translate}}</h2>
</div>
<div class="row">
    <div class="col-md-6 col-xs-12">
        <!-- TIMELINE -->
        <ib-mmb-time-line list-time-line="summaryTabCtrl.model.timeLineInfo"></ib-mmb-time-line>
        <!-- IR A CHECKIN -->
        <ib-box-module-link class="ib-layout__section" data-ng-class="summaryTabCtrl.checkInLinkData.colSize" ng-if="summaryTabCtrl.model.infoCheckIn"
                            link-id="summaryTabCtrl.checkInLinkData.linkId"
                            box-size="summaryTabCtrl.checkInLinkData.boxSize"
                            icon="summaryTabCtrl.checkInLinkData.icon"
                            text="summaryTabCtrl.checkInLinkData.text"
                            value="summaryTabCtrl.model.infoCheckIn[0].openDate"></ib-box-module-link>
    </div>
    <div class="col-md-6 col-xs-12">
        <!-- CHECKLIST -->
        <ib-mmb-check-list model="summaryTabCtrl.model.infoAncillaries"></ib-mmb-check-list>
        <!--Ancillaries modules-->
        <ib-ancillaries></ib-ancillaries>
    </div>
</div>
