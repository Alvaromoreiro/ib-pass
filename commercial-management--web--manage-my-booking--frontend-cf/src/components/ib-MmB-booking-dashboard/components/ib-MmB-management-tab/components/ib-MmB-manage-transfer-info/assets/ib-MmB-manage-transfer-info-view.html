<fieldset class="ib-box-menu__section ib-box-menu__section--full">
    <legend class="u-hide-accessible">{{manageTransferInfoCtrl.model[0].name}}</legend>
    <div>
        <section class="ib-layout__section">
            <div class="ib-box-cols">
                <div class="ib-box-cols__header">
                    <h3 class="ib-box-cols__title ib-box-cols__title--with-icon">
                       {{'WIDGET_YOUR_TRANSFERS'|translate}}</h3>
                </div>
                <div>
                    <div class="ib-box-cols__content" data-ng-repeat="transferVehicle in manageTransferInfoCtrl.model">
                        <div class="ib-box-cols__link-container ib-box-cols__link-container--icon">
                            <span class="ib-box-cols__title-section u-mb-xsmall icon-alquiler_de_coches">{{transferVehicle.name}} </span>
                            <span class="ib-text u-mb-xsmall ib-text--block">{{manageTransferInfoCtrl.city}}</span>
                            <span class="ib-text u-mb-small ib-text--underline">{{'MMB_VC_IB_VACIONES_RESERVED'|translate}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</fieldset>
