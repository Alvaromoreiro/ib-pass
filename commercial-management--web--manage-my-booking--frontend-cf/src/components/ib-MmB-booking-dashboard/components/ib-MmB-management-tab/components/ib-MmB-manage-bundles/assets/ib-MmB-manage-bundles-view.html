<fieldset class="ib-box-menu__section ib-box-menu__section--full">
   <div ng-repeat="(index, bundle) in manageBundlesCtrl.model">
        <section class="ib-layout__section">
            <div class="ib-box-cols">
                <div class="ib-mmb-dash-item__top ib-mmb-dash-item__top--icon icon-descuento">
                    <h3 class="ib-mmb-dash-item__title">{{'BUNDLE_SUMMARY_TITLE'|translate}}</h3>
                </div>
                <div class="ib-mmb-dash-item__content-bottom">
                    <div class="ib-mmb-dash-item__info">
                        <span class="ib-mmb-dash-item__trip--departure ib-mmb-dash-item__trip--city u-font-italic">{{'BUNDLE_CARD_DESCRIPTION'|translate}}</span>
                        <div class="ib-mmb-dash-item__concept">
                            <p class="ib-mmb-dash-item__concept">
                                <span class="ib-mmb-dash-item__concept--text">
                                    {{manageBundlesCtrl.model.bundleText}}
                                </span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</fieldset>
