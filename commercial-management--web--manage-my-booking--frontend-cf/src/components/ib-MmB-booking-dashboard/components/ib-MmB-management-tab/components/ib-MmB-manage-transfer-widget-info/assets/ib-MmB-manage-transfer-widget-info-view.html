<fieldset class="ib-box-menu__section ib-box-menu__section--full">
    <legend class="u-hide-accessible">{{'WIDGET_YOUR_TRANSFERS' | translate}}</legend>
    <div>
        <section class="ib-layout__section">
            <div class="ib-box-cols">
                <div class="ib-box-cols__header">
                    <h3 class="ib-box-cols__title">{{'WIDGET_YOUR_TRANSFERS' | translate}}</h3>
                </div>
                <div>
                    <div class="ib-box-cols__content"
                        data-ng-repeat="(index, transfers) in manageTransferWidgetInfoCtrl.order">
                        <a class="ib-box-cols__link-container ib-box-cols__link-container--icon-caret"
                            href="javascript:void(0)"
                            data-ng-click="manageTransferWidgetInfoCtrl.openModalConditions($event, transfers)"
                            title="{{'MMB_SEATS_TOOLTIP_MORE_INFO'|translate}}" focusin>
                            <span
                                class="ib-box-cols__title-section u-mb-small">{{transfers.name}}</span>
                        </a>
                        <a class="ib-box-cols__link-container ib-box-cols__link-container"
                            href="javascript:void(0)"
                            data-ng-click="manageTransferWidgetInfoCtrl.openModalConditions($event, transfers)"
                            focusin>
                            <span
                            class="ib-box-cols__title-section u-mb-small">{{transfers.startDate}}</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</fieldset>
