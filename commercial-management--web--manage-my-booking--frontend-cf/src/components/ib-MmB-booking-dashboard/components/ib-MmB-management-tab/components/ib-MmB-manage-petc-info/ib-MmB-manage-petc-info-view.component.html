<fieldset class="ib-box-menu__section ib-box-menu__section--full">
    <legend class="u-hide-accessible">{{ 'PET_IN_CABIN' | translate }}</legend>
    <div>
        <section class="ib-layout__section">
            <div class="ib-box-cols">
                <div class="ib-box-cols__header">
                    <h3 class="ib-box-cols__title">
                        {{ 'PET_IN_CABIN' | translate }}
                    </h3>
                </div>
                <div *ngIf="hasPendingPayment()" class="ib-msg-alert ib-msg-alert--petc-warning icon-alerta_grave">
                    <p class="ib-msg-alert__text--petc-title">{{'MMB_PETS_MANDATORY_CHECK' | translate}}</p>
                    <p class="ib-msg-alert__text--petc-content">{{'MMB_PETC_PAYMENT_REMINDER' | translate}}</p>
                </div>
                <div class="ib-box-cols__content" *ngFor="let flight of petcItems; trackBy: trackBySliceId">

                    <button type="button" class="ib-mmb-dash-item__trip ib-mmb-dash-item__trip--caret"
                        (click)="openModalConditions()">

                        <span class="ib-box-cols__title-section u-mb-small">
                            {{flight.departure.name}} ({{flight.departure.code}}) -
                            {{flight.arrival.name}} ({{flight.arrival.code}})
                        </span>

                        <ng-container>
                            <p class="ib-text u-mb-small ib-text--block ib-text--icon-small icon-huella">
                                {{getPetsCount(flight)}} {{ hasSingularOrPlural(flight) }}
                            </p>
                        </ng-container>
                    </button>
                </div>
            </div>
        </section>
    </div>
</fieldset>
