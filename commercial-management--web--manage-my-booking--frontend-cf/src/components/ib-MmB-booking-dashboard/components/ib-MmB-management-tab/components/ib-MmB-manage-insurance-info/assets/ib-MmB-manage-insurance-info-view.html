<fieldset class="ib-box-menu__section ib-box-menu__section--full">
    <legend class="u-hide-accessible">{{'MMB_YOUR_SECURE' | translate}}</legend>
    <div>
        <section class="ib-layout__section">
            <div class="ib-box-cols">
                <div class="ib-box-cols__header">
                    <h3 class="ib-box-cols__title">{{'MMB_YOUR_SECURE' | translate}}</h3>
                </div>
                <div>
                    <div class="ib-box-cols__content" data-ng-repeat="insurance in manageInsuranceInfoCtrl.insurance">
                        <span class="ib-text u-mb-small ib-text--block icon-seguros">
                            1 x {{'MMB_YOUR_SECURE_LABEL'|translate}} ({{insurance.totalPrice}})
                        </span>
                        <span class="ib-text u-mb-small ib-text--block">
                            {{'MMB_YOUR_SECURE_CONTRACT_NUMBER'|translate}}: {{insurance.contractNumber}}
                        </span>
                    </div>
                </div>
            </div>
        </section>
    </div>
</fieldset>
