<fieldset class="ib-box-menu__section ib-box-menu__section--full">
    <legend class="u-hide-accessible">{{'WIDGET_YOUR_EXPERIENCES'|translate}}</legend>
    <div>
        <section class="ib-layout__section">
            <div class="ib-box-cols">
                <div class="ib-box-cols__header">
                    <h3 class="ib-box-cols__title ib-box-cols__title--without-icon">
                        {{'WIDGET_YOUR_EXPERIENCES'|translate}}</h3>
                </div>
                <div>
                    <div class="ib-box-cols__content" data-ng-repeat="experience in manageExperienceInfoCtrl.model">
                        <div class="ib-box-cols__link-container ib-box-cols__link-container">
                            <span class="ib-box-cols__title-section u-mb-xsmall">{{experience.name}}</span>
                            <span class="ib-text u-mb-xsmall ib-text--block">{{manageExperienceInfoCtrl.arrivalCity}} - {{manageExperienceInfoCtrl.activityDate | date:'dd/MM/yyyy'}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</fieldset>
