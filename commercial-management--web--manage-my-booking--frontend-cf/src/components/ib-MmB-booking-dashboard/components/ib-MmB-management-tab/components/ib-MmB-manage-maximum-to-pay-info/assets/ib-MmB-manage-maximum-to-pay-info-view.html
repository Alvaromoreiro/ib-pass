<fieldset class="ib-box-menu__section ib-box-menu__section--full">
    <div class="ib-box ib-box--smedium ib-box--separator u-mb-none" data-ng-repeat="(index, package) in manageMaximumToPayInfoCtrl.model">
        <span class="ib-text ib-text--block ib-text--color-unfocused">{{'MMB_VC_IB_VACIONES_MAXIMUM_TO_PAY'|translate}}</span>
        <div class="row">
            <div class="col-xs-12 col-md-8">
                <div class="ib-layout__line-spacing ib-layout__line-spacing--small" >
                    <!--<span class="ib-text ib-text--especial ib-text--price-big u-mb-small">{{package.pendingAmount}} {{package.payment.pending.symbol}}</span>-->
                    <span class="ib-text ib-text--especial ib-text--price-big u-mb-small">{{package.payment.pending.total}}{{package.payment.pending.symbolBreakdown}}</span>
                </div>
            </div>
            <div class="col-xs-12 col-md-4">
                <button
                    class="ib-button ib-button--w-medium u-mb-medium u-float-right ib-button--block-sm"
                    type="submit" data-ng-click="manageMaximumToPayInfoCtrl.pendingPaymentIBV()">{{'CONFIDENTIALITY_INFO_MODAL_LINK_CONTINUE'|translate}}
                </button>
            </div>
        </div>
        <p class="ib-text ib-text--color-unfocused">
            {{'MMB_VC_IB_VACIONES_SUBSCRIBE_REST'|translate}} {{package.payment.pending.datePendingFormat}}{{'MMB_VC_IB_VACIONES_PASSED_DATE'|translate}}
        </p>
    </div>
</fieldset>
