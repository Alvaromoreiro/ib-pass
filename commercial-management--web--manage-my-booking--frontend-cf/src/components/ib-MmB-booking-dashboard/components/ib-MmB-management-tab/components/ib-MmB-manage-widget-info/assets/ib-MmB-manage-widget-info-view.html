<fieldset class="ib-box-menu__section ib-box-menu__section--full">
    <legend class="u-hide-accessible">{{'WIDGET_YOUR_EXPERIENCES' | translate}}</legend>
    <div>
        <section class="ib-layout__section">
            <div class="ib-box-cols">
                <div class="ib-box-cols__header">
                    <h3 class="ib-box-cols__title">{{'WIDGET_YOUR_EXPERIENCES' | translate}}</h3>
                </div>
                <div>
                    <div class="ib-box-cols__content"
                        data-ng-repeat="(index, experiencie) in manageWidgetInfoCtrl.order">
                        <a class="ib-box-cols__link-container ib-box-cols__link-container--icon-caret"
                            href="javascript:void(0)"
                            data-ng-click="manageWidgetInfoCtrl.openModalConditions($event, experiencie)"
                            title="{{'MMB_SEATS_TOOLTIP_MORE_INFO'|translate}}" focusin>
                            <span
                                class="ib-box-cols__title-section u-mb-small">{{experiencie.name}}</span>
                        </a>
                        <a class="ib-box-cols__link-container ib-box-cols__link-container"
                            href="javascript:void(0)"
                            data-ng-click="manageWidgetInfoCtrl.openModalConditions($event, experiencie)"
                            focusin>
                            <span
                            class="ib-box-cols__title-section u-mb-small">{{experiencie.startDate}}</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</fieldset>
