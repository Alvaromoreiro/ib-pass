<div class="ib-info-journey ib-info-journey--full">
    <div class="ib-info-journey__body">
        <div class="ib-info-journey__body-content">
            <div class="ib-info-journey__content-time ib-info-journey__content-time--left">
                <span class="ib-info-journey__time">
                    {{ flightsInfoCtrl.model.departureTime }}
                    <!-- <span class="mm_t30_Code">{{flightsInfoCtrl.model.origin}}</span> -->
                </span>
            </div>
            <div class="ib-info-journey__content-detail">
                <span class="ib-info-journey__detail">{{ flightsInfoCtrl.model.stopsNumber }} {{ flightsInfoCtrl.model.scale | translate}}</span>
                <span class="ib-info-journey__detail">{{ flightsInfoCtrl.model.passedTime }}</span>
            </div>
            <div class="ib-info-journey__content-time ib-info-journey__content-time--right">
                <span class="ib-info-journey__time">
                    {{ flightsInfoCtrl.model.arrivalTime }}
                    <!-- <span class="mm_t30_Code">{{flightsInfoCtrl.model.destination}}</span> -->
                </span>
            </div>
        </div>
    </div>
    <div class="ib-info-journey__footer">
        <div class="ib-info-journey__company">
            <span class="ib-info-journey__footer-detail">{{ 'MMB_VC_INFO_OPERATED_BY' | translate }}</span>
            <figure class="ib-info-journey__img ib-info-journey__img--scale" data-scales="{{ flightsInfoCtrl.model.numberOpereds }}">
                <img data-ng-src="{{flightsInfoCtrl.model.iconCompany.companyURL}}" alt="Company logo" />
            </figure>
        </div>
        <div class="ib-info-journey__collapse">
            <span data-flight-icon-detail class="ib-info-journey__action icon-flecha_1_abajo" ng-class="flightsInfoCtrl.statuscollapse ? 'icon-flecha_1_arriba' : 'icon-flecha_1_abajo'">{{ 'MMB_YOUR_FLIGHTS_DETAILS_TEXT' | translate }}</span>
        </div>
    </div>
</div>
