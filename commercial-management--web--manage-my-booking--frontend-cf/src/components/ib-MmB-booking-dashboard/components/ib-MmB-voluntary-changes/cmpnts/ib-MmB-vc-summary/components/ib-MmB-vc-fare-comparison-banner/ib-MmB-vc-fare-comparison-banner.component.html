<div class="vc-fare-comparison-banner">
    <div class="vc-fare-comparison-banner__inner">
        <div class="vc-fare-comparison-banner__left">
            <h3 class="vc-fare-comparison-banner__title">
                Cambio de tarifa
            </h3>
            <p class="vc-fare-comparison-banner__description">
                Recuerda que has seleccionado una tarifa distinta a la de la reserva original
            </p>
        </div>
        <div class="vc-fare-comparison-banner__right">
            <div class="vc-fare-comparison-banner__route" *ngFor="let slice of slices">
                <span class="vc-fare-comparison-banner__route-icon icon-me-gusta-volar"></span>
                <span class="vc-fare-comparison-banner__route-code">
                    {{ getRouteCode(slice) }}
                </span>
                <span class="vc-fare-comparison-banner__separator">|</span>
                <button type="button" class="vc-fare-comparison-banner__compare-btn"
                        aria-label="Ver comparativa de tarifas"
                        (click)="openModalCompareFares(slice)">
                    Comparar tarifas
                </button>
            </div>
        </div>
    </div>
</div>
