<main class="ib-layout ib-layout--bck-1 ng-scope">
    <ib-header-steps class="ng-isolate-scope">
        <header class="ib-header-steps">
            <div class="container">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="ib-header-steps__content">
                            <div class="ib-header-steps__block--left">
                                <a focusin="" href="javascript:void(0)" title="Ir a home" class="ib-header-steps__logo"
                                    ng-click="voluntaryChangesCtrl.showModalByModal()">
                                    <figure class="ib-header-steps__fig">
                                        <img alt="Logo Iberia"
                                            data-ng-src="{{::$root.routes.images}}/logos/logo_iberia_red.svg">
                                    </figure>
                                </a>
                                <div class="ib-header-steps__content--bordered">
                                    <span class="ib-header-steps__txt">{{'MMB_VC_CHANGE_FLIGHT' | translate}}</span>
                                    <span
                                        class="ib-header-steps__txt--short visible-sm-inline-block visible-xs-inline-block">{{voluntaryChangesCtrl.stepPoint}}/{{voluntaryChangesCtrl.totalSteps}}</span>
                                </div>
                            </div>
                            <div class="ib-header-steps__block--right">
                                <a href="javascript:void(0)" class="ib-header-steps__link icon-cerrar"
                                    ng-click="voluntaryChangesCtrl.showModalByModal()">{{'MMB_VC_BACK_TO_BOOKING_MANAGEMENT' | translate}}</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="hidden-xs hidden-sm">
                <ib-ui-steps steps="voluntaryChangesCtrl.steps" show-numbers="false"></ib-ui-steps>
            </div>
        </header>
    </ib-header-steps>
    <div class="container" ng-if="voluntaryChangesCtrl.actualStep === 'SELECT_FLIGHT'">
        <div class="row">
            <div class="col-xs-12">
                <div class="ib-layout__section ib-layout__section--big">
                    <ib-MmB-booking-availability model="voluntaryChangesCtrl.model"
                        dates="voluntaryChangesCtrl.originalDateFlights"></ib-MmB-booking-availability>
                </div>
            </div>
        </div>
    </div>
    <div class="container" ng-if="voluntaryChangesCtrl.actualStep === 'SUMMARY'">
        <div class="row">
            <div class="col-xs-12">
                <div class="ib-layout__section ib-layout__section--big">
                    <ib-mmb-vc-summary-main></ib-mmb-vc-summary-main>
                </div>
            </div>
        </div>
    </div>
    <div class="container" ng-if="voluntaryChangesCtrl.showPmtView">
        <div class="row">
            <div class="col-xs-12">
                <div class="ib-layout__section ib-layout__section--big">
                    <ib-mmb-payment-page></ib-mmb-payment-page>
                </div>
            </div>
        </div>
    </div>
    <div class="container" ng-if="voluntaryChangesCtrl.actualStep === 'CONFIRMATION' && !voluntaryChangesCtrl.showPmtView">
        <div class="row">
            <div class="col-xs-12">
                <div class="ib-layout__section ib-layout__section--big">
                    <ib-mmb-confirmation-selector></ib-mmb-confirmation-selector>
                </div>
            </div>
        </div>
    </div>
    <div class="container" ng-if="voluntaryChangesCtrl.actualStep === 'COMUNICATION_LOST'">
        <div class="row">
            <div class="col-xs-12">
                <div class="ib-layout__section ib-layout__section--big">
                    <ib-mmb-communication-lost></ib-mmb-communication-lost>
                </div>
            </div>
        </div>
    </div>
    <ib-mmb-main-footer ng-show="$root.showHeaders"></ib-mmb-main-footer>
</main>
