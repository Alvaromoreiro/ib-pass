 <div class="ib-input mmb-form-textarea" [class.has-error]="showError"> 
  <label [attr.for]="id" class="mmb-form-textarea__label" *ngIf="props.label">
    <span>{{ props.label }}</span> 
    <span *ngIf="props.required" class="asterisco">*</span>
    <span *ngIf="props.maxLength" class="mmb-form-textarea__counter">
      {{ (formControl.value?.length || 0) }} / {{ props.maxLength }}
    </span>
  </label> 
    <textarea class="ib-input__textarea mmb-form-textarea__textarea"
      title="{{props.description}}"
      [placeholder]="props.description"
      [id]="id"
      [formControl]="formControl"
      [formlyAttributes]="field"
      [attr.maxlength]="props.maxLength ? props.maxLength : null"
      rows="4">
    </textarea>
    
</div>
<p *ngIf="showError" class="ib-alert ib-alert--error" >{{getCustomErrorMessage }}</p>
