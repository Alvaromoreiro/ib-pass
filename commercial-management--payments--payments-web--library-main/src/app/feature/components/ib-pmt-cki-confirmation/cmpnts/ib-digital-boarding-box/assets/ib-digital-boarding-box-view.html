<div class="ib-ticket-flights">
  <div class="ib-ticket-flights__ticket">
    <section class="ib-layout__section">
        <a class="ib-box-link ib-box-link__gdr" style="border-top: 0px" href="javascript:void(0)" data-ng-click="ibDigitalBoardingBoxCtrl.redirectToDigitalBoarding()" title=""
            focusin>
            <div class="ib-box-link__container">
                <h3 class="ib-heading ib-heading--title-box">
                    <span class="ib-heading ib-heading--type-1 ib-heading--primary" ng-class="ibDigitalBoardingBoxCtrl.icon"></span>
                    {{ibDigitalBoardingBoxCtrl.tittle|translate}}
                </h3>
                <span class="ib-text ib-text--block ib-text--color-unfocused">{{ibDigitalBoardingBoxCtrl.infoDigitalBoarding.message|translate}}</span>
            </div>
        </a>
    </section>
  </div>
</div>
