<div class="ib-biometric__box--flex " ng-class="ibBioBoardingBoxCtrl.modifier">
    <p class="ib-biometric__box--container">
        <span class="ib-biometric__icon" ng-class="ibBioBoardingBoxCtrl.iconModifier"><span class="{{ibBioBoardingBoxCtrl.icon}}"></span></span>
        <span class="ib-biometric__box--text">
            <span ng-class="{'ib-biometric__box--text-normal' : !ibBioBoardingBoxCtrl.hasButton}">{{ibBioBoardingBoxCtrl.text|translate}}</span>
            <span ng-if="ibBioBoardingBoxCtrl.strongText" class="ib-text ib-text--bold">{{ibBioBoardingBoxCtrl.textStrong|translate}}</span>
        </span>
    </p>
    <button ng-if="ibBioBoardingBoxCtrl.hasButton" type="button" class="ib-button ib-button--medium" title="{{ibBioBoardingBoxCtrl.buttonText|translate}}" data-navegation="ibBioBoardingBoxCtrl.buttonNagation" ng-click="ibBioBoardingBoxCtrl.goToBioBioardingInfoUrl()" focusin>{{ibBioBoardingBoxCtrl.buttonText|translate}}</button>
</div>
