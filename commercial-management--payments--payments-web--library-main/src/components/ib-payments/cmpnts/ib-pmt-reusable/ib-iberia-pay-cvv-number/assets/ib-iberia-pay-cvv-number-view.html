<div id="ibdc_cvv">
    <ib-iberia-pay-card-cvv-number-iframe id="pmt-ibreria-pay-card-cvv-number-iframe" class="ib-form-iframe--mask" data-ng-if="ibIberiaPayCvvNumberCtr.urlIframeCvv"
        url-iframe-cvv="{{ibIberiaPayCvvNumberCtr.urlIframeCvv}}" vault-id="{{ibIberiaPayCvvNumberCtr.vaultId}}">
    </ib-iberia-pay-card-cvv-number-iframe>
    <div id="pmt-ibreria-pay-card-cvv-number-error-msg" class="ib-alert ib-alert--error ib-form-iframe--validation" data-ng-if="ibIberiaPayCvvNumberCtr.errorCvvIbPay && !ibIberiaPayCvvNumberCtr.disabledCvv">
        {{ibIberiaPayCvvNumberCtr.errorCvvIbPay === 88 ? ('GENERAL_INPUT_PATTERN_ERROR'|translate) : ('GENERAL_INPUT_REQUIRED_ERROR'|translate) }}
    </div>
    <span id="pmt-ibreria-pay-card-cvv-what-is-msg" class="ib-alert">
        <a class="ib-link" href="javascript:void(0)" data-ng-click="ibIberiaPayCvvNumberCtr.openModal()"
        title="{{$root.appMarket === 'US' ? ('PMT_FORM_CVV_WHAT_IS_US'|translate) : ('PMT_FORM_CVV_WHAT_IS'|translate)}}">
            {{$root.appMarket === 'US' ? ('PMT_FORM_CVV_WHAT_IS_US'|translate) : ('PMT_FORM_CVV_WHAT_IS'|translate)}}
        </a>
    </span>
</div>
