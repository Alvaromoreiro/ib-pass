<div class="ib-modals">
    <header class="ib-modals__header--inside">
        <h3 class="ib-heading ib-heading--type-23">{{'MARKETING_PERMISSION_TITLE'|translate}}</h3>
        <div class="ib-modals__header-settings">
            <button type="button" class="ib-modals__button-action ib-modals__button-action--small icon-cerrar"
                id="MODAL_MARKETING_PERMISSIONS" ng-click="modalCtrl.close()">
                <span class="hide-accessible">{{'MODAL_CLOSE_ACCESS'|translate}}</span>
            </button>
        </div>
    </header>
    <section class="ib-modals__body ib-modals__body--background-grey">
        <div class="ib-alertbox ib-alertbox--no-margin-bottom" aria-label="Mensaje de Información" >
            <div class="ib-alertbox__head mp-logo-card ib-alertbox--display-block">
                <img class="ib-check--width ib-check__label--margin-bottom ib-check--margin-bottom" ng-src="{{'../../iberia-web-content/iconos/svgs/sobre_marketing_permission_XS.svg'}}" alt="marketing_permission_bullet" />
                <div class="ib-alertbox__content ib-alertbox__content--small ib-alertbox__content--black">
                    <h3 class="ib-heading ib-heading--type-4 ib-text--color-black">{{'MARKETING_PERMISSION_BODY'|translate}}</h3>
                    <ul class="ib-flash-offers-detail__list ib-text--color-black">
                        <li
                            class="ib-flash-offers-detail__item ib-flash-offers-detail__item--black ib-flash-offers-detail__item--small">
                            <p class="ib-flash-offers-detail__text">{{'MARKETING_PERMISSION_BULLET_1'|translate}}</p>
                        </li>
                        <li
                            class="ib-flash-offers-detail__item ib-flash-offers-detail__item--black ib-flash-offers-detail__item--small">
                            <p class="ib-flash-offers-detail__text">{{'MARKETING_PERMISSION_BULLET_2'|translate}}</p>
                        </li>
                        <li
                            class="ib-flash-offers-detail__item ib-flash-offers-detail__item--black ib-flash-offers-detail__item--small">
                            <p class="ib-flash-offers-detail__text">{{'MARKETING_PERMISSION_BULLET_3'|translate}}</p>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </section>
    <footer class="ib-modals__footer">
        <div class="ib-content-buttons ib-content-buttons__full-responsive ib-content-buttons--not-reversed ib-content-buttons__no-mt">
            <div class="ib-content-buttons__content-left ib-content-buttons--order1">
                <button class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.continueModalMP(modalCtrl.isMarketingAccepted)">{{'MARKETING_PERMISSION_BULLET_CTA_ACCEPT'|translate}}</button>
            </div>
            <div class="ib-content-buttons__content-right ib-content-buttons--order0 ib-modals--mt-small">
                <div class="ib-check">
                    <input type="checkbox" id="IBAIRP_CONTACT_MP_CHECK" name="MarketingPermissionCheck" class="ib-check__input" ng-model="modalCtrl.isMarketingAccepted">
                    <label for="IBAIRP_CONTACT_MP_CHECK" class="ib-check__label ib-check__label--width-auto">
                        <span class="ib-check__text">{{'MARKETING_PERMISSION_BULLET_CTA_SUBSCRIBE'|translate}}</span>
                    </label>
                </div>
            </div>
        </div>
    </footer>
</div>
