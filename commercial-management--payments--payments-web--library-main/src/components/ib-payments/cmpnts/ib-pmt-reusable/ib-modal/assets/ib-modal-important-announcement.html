<header class="ib-modals__header">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1">{{'GENERAL_ADVICE_TITLE' | translate}}</h2>
    </div>
    <h3 class="ib-heading ib-heading--type-5 ib-heading--unfocused">{{'MODAL_PAYMENTS_SUBTITLE' | translate}}</h3>
    <div class="ib-modals__header-settings">
        <button type="button" class="ib-modals__button-action icon-cerrar" ng-click="modalCtrl.close()">
            <span class="u-hide-accessible">{{'MODAL_HIDDEN_CLOSE_TEXT' | translate}}</span>
        </button>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <p class="ib-text">
            {{'MODAL_PAYMENTS_WARN_MESSAGE' | translate}} <strong class="ib-text ib-text--bold ib-text--inline">{{'MODAL_PAYMENTS_WHAT_TO_DO' | translate}}</strong>
        </p>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
            <button class="ib-button ib-button--w-medium" type="button" ng-click="modalCtrl.close()">{{'MODAL_PAYMENTS_STAY' | translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <a href="#" title="{{'MODAL_PAYENTS_GO_HOME' | translate}}" ng-click="modalCtrl.returnToHomepage()" class="ib-link">{{'MODAL_PAYENTS_GO_HOME' | translate}}</a>
        </div>
    </div>
</footer>
