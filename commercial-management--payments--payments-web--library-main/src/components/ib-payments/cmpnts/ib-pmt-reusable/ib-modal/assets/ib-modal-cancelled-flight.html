<header class="ib-modals__header">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--xsmall">
        <h2 class="ib-heading ib-heading--type-1">
            <span class="ib-heading__icon ib-heading__icon--default icon-alerta_grave"></span>
            <span class="ib-heading__text">{{modalCtrl.model.title|translate}}</span></h2>
    </div>
</header>
<section class="ib-modals__body">
    <div class="ib-layout__line-spacing ib-layout__line-spacing--big u-pb-medium">
        <p class="ib-text">{{modalCtrl.model.body|translate}}</p>
    </div>
</section>
<footer class="ib-modals__footer">
    <div class="ib-content-buttons">
        <div class="ib-content-buttons__content-left">
            <button id="bbki-on-business-option-accept-checked-btn" class="ib-button ib-button--w-medium" ng-click="modalCtrl.accept(true)">{{modalCtrl.model.rightButton|translate}}</button>
        </div>
        <div class="ib-content-buttons__content-right">
            <button id="bbki-on-business-option-accept-unchecked-btn" class="ib-button ib-button--w-medium" ng-click="modalCtrl.accept(false)">{{modalCtrl.model.leftButton|translate}}</button>
        </div>
    </div>
</footer>
