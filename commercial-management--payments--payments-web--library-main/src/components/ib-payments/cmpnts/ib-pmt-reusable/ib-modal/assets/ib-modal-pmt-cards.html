<section id="pmt-payments-cards-modal" class="ib-modals__body u-mb-medium u-align-self-center">
	<div ng-if="modalCtrl.model.transition" class="u-text-center">
		<div id="container-loading" ng-include="::$root.routes.images + '/payment-tabs/transitions/' + modalCtrl.model.transition + '.svg'" alt="{{'MODAL_WAITING_MESSAGE'|translate}}"></div>
		<span class="ib-loading-points"></span>
	</div>
	<div ng-if="!modalCtrl.model.transition" class="ib-loading-card u-mb-negative-biggest">
		<div id="container-loading" ng-include="::$root.routes.images + '/cargando/paymentLoading.svg'" alt="{{'MODAL_WAITING_MESSAGE'|translate}}"></div>
	</div>
	<div class="ib-layout__line-spacing ib-layout__line-spacing--small">
		<span class="ib-heading ib-heading--light ib-heading--font-normal ib-heading--type-4 ib-heading--block ib-heading--to-center u-font-xnormal">{{'WAITING_LOADING_PAYMENTS_CARDS_TITLE'|translate}}</span>
	</div>
	<div class="ib-layout__line-spacing ib-layout__line-spacing--small">
		<span class="ib-heading ib-heading--light ib-heading--font-normal ib-heading--block ib-heading--to-center u-font-xxs">{{'WAITING_LOADING_PAYMENTS_CARDS_TEXT'|translate}}</span>
