<div class="ib-summary-item u-p-none" ng-switch="summaryItemCtrl.model.type">
    <div class="ib-summary-item__content u-pt-none" ng-switch-default>
        <h4 class="ib-heading ib-heading--type-4 ib-summary__section-title">
            <span class="ib-summary-item__title--text">{{'SUMMARY_OTHER_FEES'|translate}}</span>
        </h4>
        <div class="ib-summary-item__item" data-ng-repeat="(feeIndex, feeInfo) in PmtSummaryOtherCtrl.orderFees">
            <div class="ib-list-passengers__item-description ib-list-passengers__item-description--long u-pb-small">
                <span class="ib-text ib-text--color-unfocused">
                    <span>{{feeInfo.description|translate}}</span> 
                </span>
                <span class="ib-text ib-text--color-normal">
                    {{feeInfo.fee}}
                </span>
            </div>
        </div>
    </div>
</div>
<div class="ib-summary__subtotal ib-summary__subtotal--separator" data-ng-if="PmtSummaryOtherCtrl.orderFees.totalFormatted">
    <span class="ib-text ib-text--bold">{{'HEADER_BASKET_OTHERS_AMOUNT'|translate}}</span>
    <span class="ib-text ib-text--bold">{{PmtSummaryOtherCtrl.orderFees.totalFormatted}}</span>
</div>
