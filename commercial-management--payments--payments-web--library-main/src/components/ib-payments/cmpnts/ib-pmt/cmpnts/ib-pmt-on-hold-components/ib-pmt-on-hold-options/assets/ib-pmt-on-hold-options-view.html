<equal-height>
    <fieldset>
        <legend class="u-hide-accessible">{{'ONHOLD_TITLE_ACCESSIBLE' | translate}}</legend>
        <div class="row u-mb-medium">
            <div class="col-sm-12" data-ng-class="{'col-md-4': onHoldOptionsCtrl.onHoldOptions.length > 2, 'col-md-6': onHoldOptionsCtrl.onHoldOptions.length <= 2}"
                data-ng-repeat="(optionIndex,option) in onHoldOptionsCtrl.onHoldOptions">
                <ib-pmt-on-hold-info id="pmt-on-hold-options-on-hold-info-{{$index}}" option-info="option" option-index="optionIndex" selected-on-hold-index="onHoldOptionsCtrl.selectedOnHoldIndex"></ib-pmt-on-hold-info>
            </div>
        </div>
    </fieldset>
</equal-height>
