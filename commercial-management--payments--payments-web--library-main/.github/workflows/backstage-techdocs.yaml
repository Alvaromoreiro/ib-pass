name: Backstage TechDocs

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "docs/**"
      - mkdocs.yml
      - .backstage/pyproject.toml

jobs:
  publish-techdocs-site:
    name: TechDocs
    uses: Iberia-Ent/software-engineering--platform--workflow--techdocs/.github/workflows/backstage-techdocs.yml@v1.0
    with:
      backstage-entity-name: payments.payments-web
    secrets: inherit
